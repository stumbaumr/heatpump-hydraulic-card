<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heatpump Flow Card – self-test</title>
<!--
  Runs in a headless browser (see .github/workflows/validate.yml):
  every demo installation in every scenario, broken entity states, edge-case configs,
  preset detection (including gas boilers that must not be taken for heat pumps) and the computed values.
  Result: <pre id="result">PASS</pre> or FAIL with the failed checks.
-->
</head>
<body>
<pre id="result">RUNNING</pre>
<pre id="log"></pre>
<script src="../dist/heatpump-hydraulic-card.js"></script>
<script src="../demo/setups.js"></script>
<script>
(async () => {
  const C = customElements.get('heatpump-flow-card');
  const fails = []; const log = []; let checks = 0;
  const check = (ok, label) => { checks++; if (!ok) fails.push(label); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Same state format as the demo: value, [value, unit] or {state, attributes}.
  const toStates = (obj) => {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v && typeof v === 'object' && !Array.isArray(v)) { out[k] = { entity_id: k, attributes: {}, ...v }; continue; }
      const [state, unit] = Array.isArray(v) ? v : [v];
      out[k] = { entity_id: k, state, attributes: unit ? { unit_of_measurement: unit } : {} };
    }
    return out;
  };
  const hassOf = (states, registry = {}, energy, setup = {}) => ({
    states, entities: registry, locale: { language: 'en' }, language: 'en',
    callWS: (m) => (m.type === 'recorder/statistic_during_period' ? statChange(setup, m)
      : m.type === 'history/history_during_period' && setup.states ? historySim(setup, m)
      : m.type === 'energy/get_prefs' && energy ? Promise.resolve(energy) : Promise.reject(new Error('n/a'))),
    callService: () => Promise.resolve(),
  });
  const mount = (config, hass) => {
    C._energyPrefs = null;
    const card = document.createElement('heatpump-flow-card');
    card.setConfig(config);
    document.body.appendChild(card);
    card.hass = hass; card.hass = { ...hass };
    return card;
  };
  const ok = (card) => !card._failed && !!card.shadowRoot.getElementById('svg');

  // 1. every installation and scenario renders, presets are detected
  for (const [i, s] of setups.entries()) {
    for (const [scen] of scenarios) {
      const card = mount(s.config, hassOf(toStates(s.states(scen)), s.registry || {}, s.energy, s));
      await wait(5);
      check(ok(card), `render ${i}/${scen}`);
      check(card.shadowRoot.getElementById('chip-mode')?.textContent.trim().length > 0, `mode chip ${i}/${scen}`);
      if (s.config.preset) check(!card._needsBuild, `preset detected ${i}/${scen}`);
      card.remove();
    }
  }

  // 2. broken states never break the card
  const variants = ['unavailable', 'unknown', '', 'abc', '-999', '1e9', 'NaN'];
  for (const [i, s] of setups.entries()) {
    const base = toStates(s.states('heat'));
    for (const v of variants) {
      const broken = {}; for (const [k, o] of Object.entries(base)) broken[k] = { ...o, state: v, attributes: v === '' ? {} : o.attributes };
      const card = mount(s.config, hassOf(broken, s.registry || {}));
      check(ok(card), `broken state "${v}" in setup ${i}`);
      card.remove();
    }
  }

  // 3. edge-case configs
  const edge = [{}, { preset: 'none' }, { entities: { flow: 'sensor.nope', power: 'sensor.nope2' } }, { hc_count: 3, hc2_type: 'radiator' },
    { hc_count: '7' }, { controls: ['switch.nope', { entity: 'select.nope' }, null, 5] }, { details: ['sensor.nope', null] },
    { badges: [{ entity: 'x' }] }, { stats: [{ entity: 'sensor.nope' }] }, { source_type: 'brine' },
    { source_type: 'water', entities: { heater: 'sensor.h', dhw_heater: 'sensor.d' } }, { preset: 'lambda' },
    { tiles: [null, {}, 'spread', { entity: 'sensor.nope' }] }, { preset: 'lambda', tiles: ['cop_heating:year', 'load_classes', 'cost'] }];
  for (const cfg of edge) { const card = mount(cfg, hassOf(toStates({ 'sensor.h': '7', 'sensor.d': 'weird' }))); check(ok(card), `edge config ${JSON.stringify(cfg)}`); card.remove(); }

  // 4. invalid configs give a readable error
  for (const cfg of [{ preset: 'foo' }, { hc_type: 'x' }, { source_type: 'lava' }, null, { tiles: ['nope'] }, { tiles: ['cop_heating:fortnight'] }, { tiles: 'cop_heating' },
    { price: { v: 1 } }, { tiles: [{ key: 'spread', tap_action: 'navigate' }] }, { stats: [{ entity: 'sensor.x', hold_action: true }] },
    { layout: 'huge' }, { actions: [] }, { actions: { mode: 'navigate' } }, { actions: { mode: { tap_action: 'navigate' } } },
    { badges: [{ entity: 'sensor.x', hold_action: 'toggle' }] },
    { program_map: [] }, { program_map: 'eco' }, { compressor_speed_max: 0 }, { compressor_speed_max: 'fast' },
    { errors: 'sensor.error' }, { error_ok: 'No Error' }, { error_ok: ['No Error', 0] },
    { timeline: 'yes' }, { timeline_hours: 0 }, { timeline_marks: 'yes' }, { timeline_marks: [{ label: 'x' }] }, { timeline_marks: [7] }, { wall_timeout: -1 }, { wall_timeout: 'soon' }, { unit_style: 'tesla' }, { unit_size: 'huge' },
    { animations: 'sometimes' }, { flow_speed: 0 }, { flow_speed: 3.1 }, { source_spread: 'yes' }, { theme: 'sepia' }, { fullscreen: 'yes' },
    { texts: [] }, { texts: { NL: { title: 'x' } } }, { texts: { nl: { title: 7 } } }, { texts: { nl: { missing_key: 'x' } } },
    { brine_pressure_min: -0.1 }, { hc_pressure_crit: 1.2, hc_pressure_min: 1.0 }, { hc_pressure_min: 3, hc_pressure_max: 2 }]) {
    let threw = false; try { new C().setConfig(cfg); } catch (e) { threw = true; }
    check(threw, `invalid config rejected ${JSON.stringify(cfg)}`);
  }

  // 5. detection: the right preset for each installation, nothing for gas boilers or foreign entities
  check(HFC_PRESETS.heishamon.tested === true, 'HeishaMon preset is marked real-installation tested');
  const stub = (states, registry) => C.getStubConfig(hassOf(toStates(states), registry));
  const expect = { 0: 'lambda', 1: 'lambda', 2: 'vicare', 3: 'vaillant', 4: 'emsesp', 5: 'heishamon', 6: 'emsesp', 8: 'wolf', 9: 'kronoterm' };
  for (const [i, p] of Object.entries(expect)) {
    const s = setups[i]; const st = stub(s.states('heat'), s.registry || {});
    check(st.preset === p, `stub preset ${i} = ${p} (got ${st.preset})`);
    if (+i === 6) { check(st.source_type === 'brine', 'stub source_type brine'); check(st.hc_count === 2, `stub hc_count 2 (got ${st.hc_count})`); }
    if (+i === 7) check(st.hc_count === 2 && !st.source_type, `Kronoterm stub counts its two loops (${JSON.stringify(st)})`);
  }
  const detects = (preset, states, registry) => HFC_PRESETS[preset].detect(C._ctx(hassOf(toStates(states), registry), undefined, { hp: 1, dhw: 1, buffer: 1, hc: 1 })) !== undefined;
  check(!detects('emsesp', { 'sensor.boiler_curflowtemp': '45', 'sensor.boiler_outdoortemp': '5' }, { 'sensor.boiler_curflowtemp': { platform: 'mqtt' } }), 'EMS-ESP gas boiler is not a heat pump');
  check(!detects('vicare', { 'sensor.vitodens_outside_temperature': '5', 'sensor.vitodens_boiler_temperature': '60' },
    { 'sensor.vitodens_outside_temperature': { platform: 'vicare', translation_key: 'outside_temperature' } }), 'ViCare gas boiler is not a heat pump');
  check(!detects('lambda', { 'sensor.other_hp1_operating_state': 'x' }, { 'sensor.other_hp1_operating_state': { platform: 'something_else' } }), 'foreign hp1_operating_state is not Lambda');

  // Wolf (wolflink): heat pumps only, prefix = device slug; gas boilers and other platforms with the same names are not detected.
  {
    const wolfPrefix = (states, registry) => HFC_PRESETS.wolf.detect(C._ctx(hassOf(toStates(states), registry), undefined, { hp: 1, dhw: 1, buffer: 1, hc: 1 }));
    const w = setups[8].states('heat');
    check(HFC_PRESETS.wolf.tested !== true, 'Wolf preset stays marked untested');
    check(wolfPrefix(w, setups[8].registry) === 'zuhause', `Wolf prefix zuhause (got ${wolfPrefix(w, setups[8].registry)})`);
    const renamed = Object.fromEntries(Object.entries(w).map(([k, v]) => [k.replace('sensor.zuhause_', 'sensor.wolf_cha_07_'), v]));
    const renamedReg = Object.fromEntries(Object.keys(renamed).map((id) => [id, { platform: 'wolflink' }]));
    check(wolfPrefix(renamed, renamedReg) === 'wolf_cha_07', `Wolf prefix of another device slug (got ${wolfPrefix(renamed, renamedReg)})`);
    const gas = { 'sensor.heizung_boiler_temperature': '62', 'sensor.heizung_return_temperature': '48', 'sensor.heizung_outside_temperature': '5',
      'sensor.heizung_burner_status': 'Betrieb', 'sensor.heizung_burner': 'ein', 'sensor.heizung_3_way_valve': 'Heizung',
      'sensor.heizung_operating_mode': 'heizbetrieb', 'sensor.heizung_dhw_temperature': '50', 'sensor.heizung_system_pressure': '1.8' };
    check(!detects('wolf', gas, Object.fromEntries(Object.keys(gas).map((id) => [id, { platform: 'wolflink' }]))), 'Wolf gas boiler is not a heat pump');
    check(!detects('wolf', w, Object.fromEntries(Object.keys(w).map((id) => [id, { platform: 'mqtt' }]))), 'same entity names on another platform are not Wolf');
  }

  // 6. computed values
  {
    const s = setups[1];
    const card = mount(s.config, hassOf(toStates(s.states('heat')), {}, s.energy));
    await wait(20);
    const txt = (id) => card.shadowRoot.getElementById(id)?.textContent || '';
    check(card._powerMode() === 'energy', 'Energy dashboard mode');
    check(/1,094/.test(txt('t-src-pv-v')) && /146/.test(txt('t-src-grid-v')), `Energy dashboard split (${txt('t-src-pv-v')} / ${txt('t-src-grid-v')})`);
    card.remove();
  }
  {
    // One configured Energy-dashboard source has only an energy counter: give it the unexplained remainder.
    const prefs = { energy_sources: [
      { type: 'solar', stat_rate: 'sensor.pv' }, { type: 'battery', stat_rate: 'sensor.battery' },
      { type: 'grid', stat_energy_from: 'sensor.grid_energy' },
    ] };
    const hass = hassOf(toStates({ 'sensor.hp': ['1200', 'W'], 'sensor.pv': ['400', 'W'], 'sensor.battery': ['100', 'W'] }), {}, prefs);
    const card = mount({ entities: { power: 'sensor.hp' } }, hass);
    await wait(20);
    const split = card._energySplit();
    check(split.pv === 400 && split.battery === 100 && split.grid === 700, `missing grid power gets the remainder (${JSON.stringify(split)})`);
    check(/no power sensor for grid/i.test(card.shadowRoot.textContent), 'card explains a missing Energy-dashboard power sensor');
    card._hass.states['sensor.hp'].state = '40';
    check(Object.values(card._energySplit()).every((v) => v === 0), 'no source split below 50 W');
    const ed = document.createElement('heatpump-flow-card-editor');
    ed.setConfig({ entities: { power: 'sensor.hp' } }); ed.hass = hass; await wait(20);
    check(ed._energyMissing?.includes('grid') && /Energy dashboard|Energie-Dashboard/.test(ed.textContent),
      `editor explains a missing Energy-dashboard power sensor (${JSON.stringify(ed._energyMissing)} / ${ed.textContent.trim()})`);
    card.remove(); ed.remove();
  }
  {
    const s = setups[0];
    const card = mount(s.config, hassOf(toStates(s.states('heat'))));
    const rows = Object.fromEntries([...card.shadowRoot.querySelectorAll('.drow')].map((r) => [r.querySelector('span').textContent, r.querySelector('b').textContent]));
    check(rows.Superheat === '4.8 K', `superheat (${rows.Superheat})`);
    check(rows['COP total'] === '≈4.55', `total COP (${rows['COP total']})`);
    card._hass.states['sensor.eu08l_hp1_compressor_power_consumption_accumulated'] = { entity_id: 'x', state: '211072', attributes: { unit_of_measurement: 'Wh' } };
    check(card._fmtState('energy_total') === '211 kWh', `Wh shown as kWh (${card._fmtState('energy_total')})`);
    card.remove();
  }
  {
    const s = setups[6];
    const card = mount(s.config, hassOf(toStates(s.states('heat')), s.registry || {}, s.energy, s));
    await wait(20);
    const rows = Object.fromEntries([...card.shadowRoot.querySelectorAll('.drow')].map((r) => [r.querySelector('span').textContent, r.querySelector('b').textContent]));
    check(rows['Environmental energy total'] === '8,200 kWh', `environmental energy in details (${rows['Environmental energy total']})`);
    check(rows['COP total'] === '≈4.15', `total COP from environmental energy plus electricity (${rows['COP total']})`);
    check(card._e.env_energy === 'sensor.boiler_environmental_energy_total', `environmental energy mapping (${card._e.env_energy})`);
    check(/- env_energy: sensor\.boiler_environmental_energy_total = 8200 kWh/.test(C._diagnosticReport(s.config, card._hass)), 'diagnostic report contains environmental energy');
    card.remove();
  }

  // Wolf: German list states, ein/aus switches, the numeric mixer circuit pump, heat-only tiles, never a _2/_3 duplicate.
  {
    const s = setups[8];
    const states = toStates(s.states('heat'));
    const hass = hassOf(states, s.registry, null, s);
    const card = mount({ ...s.config, badges: [{ entity: 'sensor.zuhause_1x_dhw', label: '1x DHW' }] }, hass);
    await wait(20);
    const $ = (id) => card.shadowRoot.getElementById(id);
    const set = (id, state) => { states[`sensor.zuhause_${id}`].state = state; card.hass = { ...card._hass }; };
    const modes = { heizbetrieb: 'heating', warmwasser: 'dhw', 'WW-Nachlauf': 'circulate', 'HZ-Nachlauf': 'circulate', Abtaubetrieb: 'defrost', standby: 'idle' };
    Object.entries(modes).forEach(([raw, m]) => check(card._norm(card._maps.mode, raw) === m, `Wolf mode ${raw} = ${m} (got ${card._norm(card._maps.mode, raw)})`));
    check(/1,200 W → 4\.1 kW/.test($('t-hp-power').textContent) && /COP 3\.4/.test($('t-hp-cop').textContent), `Wolf kW power and heat (${$('t-hp-power').textContent} / ${$('t-hp-cop').textContent})`);
    check($('t-vol').textContent === '1,056 l/h', `Wolf L/min flow rate (${$('t-vol').textContent})`);
    check($('chip-mode').classList.contains('mode-heat') && $('t-valve').textContent === 'Heating', `Wolf valve Heizen = heating (${$('t-valve').textContent})`);
    set('3_way_diverter_valve_htg_dhw', 'warmwasser');
    check($('chip-mode').classList.contains('mode-dhw') && $('t-valve').textContent === 'DHW', `Wolf valve warmwasser = DHW (${$('t-valve').textContent})`);
    set('3_way_diverter_valve_htg_dhw', 'Heizen');
    check($('impeller').classList.contains('on'), 'Wolf mkp_mixer_circuit_pump 1 = circuit active');
    set('mkp_mixer_circuit_pump', '0');
    check(!$('impeller').classList.contains('on'), 'Wolf mkp_mixer_circuit_pump 0 = circuit off');
    check($('heater-inline') && !$('heater-inline').classList.contains('on') && !$('chip-b0').classList.contains('on'), 'Wolf heater and badge "aus" = off');
    set('electric_booster_heater', 'ein'); set('1x_dhw', 'ein');
    check($('heater-inline')?.classList.contains('on') && $('chip-b0').classList.contains('on'), 'Wolf heater and badge "ein" = on');
    check(card._e.dhw_target === 'sensor.zuhause_set_dhw_temperature_adjusted' && card._e.room_target === 'sensor.zuhause_day_temperature', 'Wolf DHW and room targets');
    const used = [...Object.values(card._e), ...card._errors, ...Object.values(card._tileMap).flatMap(Object.values)];
    check(used.length > 20 && !used.some((id) => /_[23]$/.test(id)), `Wolf never maps a _2/_3 duplicate (${used.filter((id) => /_[23]$/.test(id)).join(', ')})`);
    check(/Preset detected: yes/.test(C._diagnosticReport(s.config, hass)) && /Prefix: zuhause/.test(C._diagnosticReport(s.config, hass)), 'Wolf in the diagnostic report');
    card.remove();
    const pump = mount({ ...s.config, entities: { hc_pump: 'sensor.zuhause_mixer_circuit_pump' } }, hassOf(toStates(s.states('heat')), s.registry));
    await wait(20);
    check(pump.shadowRoot.getElementById('impeller').classList.contains('on'), 'text pump "ein" = circuit active');
    pump._hass.states['sensor.zuhause_mixer_circuit_pump'].state = 'aus'; pump.hass = { ...pump._hass };
    check(!pump.shadowRoot.getElementById('impeller').classList.contains('on'), 'text pump "aus" = circuit off');
    pump.remove();
    const options = C._tileOptions(s.config, C._resolve(s.config, hass), hass).options.map((x) => x.value);
    check(options.includes('heat_heating:total') && options.includes('heat:month') && !options.some((v) => /^(cop_(heating|dhw|cooling|total)|spf)/.test(v)),
      `Wolf heat tiles without COP tiles (${options.join(',')})`);
    const preset = C._formSchema({}).schema[0].selector.select.options.find((o) => o.value === 'wolf');
    check(preset && /untested/.test(preset.label), `Wolf in the preset dropdown, marked untested (${preset && preset.label})`);
  }

  // Direct systems use the heat-pump flow/return for their circuit and never leave the bypass pipes open.
  {
    const card = mount({ entities: { flow: 'sensor.flow', return: 'sensor.return' } }, hassOf(toStates({ 'sensor.flow': ['35', '°C'], 'sensor.return': ['30', '°C'] })));
    check(card._parts.hc && !!card.shadowRoot.getElementById('p-byp-vl') && !!card.shadowRoot.getElementById('p-hc-vl')
      && !!card.shadowRoot.getElementById('p-byp-rl') && !!card.shadowRoot.getElementById('p-hc-rl'), 'minimal direct system has a closed heating circuit');
    check(/35/.test(card.shadowRoot.getElementById('t-hc').textContent), 'direct circuit falls back to the heat-pump flow temperature');
    card.remove();
  }

  // Text errors are opt-in through their known no-error states; numeric and binary behaviour stays compatible.
  {
    const states = toStates({ 'sensor.error': 'No Error', 'binary_sensor.error': 'off' });
    const card = mount({ errors: ['sensor.error', 'binary_sensor.error'], error_ok: ['No Error', 'OK'] }, hassOf(states));
    const active = () => card.shadowRoot.getElementById('chip-err').classList.contains('on');
    check(!active(), 'configured no-error text keeps the error chip off');
    states['sensor.error'].state = 'F13'; card.hass = { ...card._hass };
    check(active(), 'other known text shows the error chip');
    states['sensor.error'].state = 'unknown'; card.hass = { ...card._hass };
    check(!active(), 'unknown text does not show the error chip');
    states['binary_sensor.error'].state = 'on'; card.hass = { ...card._hass };
    check(active(), 'binary error behaviour stays unchanged');
    card.remove();
    const legacy = mount({ errors: ['sensor.error'] }, hassOf(toStates({ 'sensor.error': 'F13' })));
    check(!legacy.shadowRoot.getElementById('chip-err').classList.contains('on'), 'text errors remain opt-in without error_ok');
    legacy.remove();
  }

  // 7. an unexpected error shows a message instead of an empty card
  {
    const s = setups[0];
    const card = mount(s.config, hassOf(toStates(s.states('heat'))));
    card._update = () => { throw new Error('boom'); };
    const orig = console.error; console.error = () => {};
    card.hass = { ...card._hass };
    console.error = orig;
    check(card._failed && /boom/.test(card.shadowRoot.textContent), 'error boundary shows a message');
    card.remove();
  }

  // 8. stat tile catalog: order, periods, statistics fallback, computed values, free entities, editor options
  const tileRows = (card) => [...card.shadowRoot.querySelectorAll('#stats .stat')].map((t) => [t.querySelector('.sl').textContent, t.querySelector('.sv').textContent]);
  const tilesOf = async (s, tiles, scen = 'heat', withStats = true) => {
    const card = mount({ ...s.config, tiles }, hassOf(toStates(s.states(scen)), s.registry || {}, null, withStats ? s : {}));
    await wait(20);
    const rows = tileRows(card); card.remove();
    return { rows, t: Object.fromEntries(rows) };
  };
  {
    const s = setups[0];
    const { rows, t } = await tilesOf(s, s.config.tiles);
    check(rows.length === 7 && rows[0][0] === 'COP heating · today' && rows[6][0] === 'Electricity heating · week', `Lambda tile order (${rows.map((r) => r[0]).join(' | ')})`);
    check(t['COP heating · today'] === '5.05', `legacy entity as today (${t['COP heating · today']})`);
    check(t['COP heating · month'] === '4.62', `preset period entity (${t['COP heating · month']})`);
    check(t['Electricity · today'] === '5.1 kWh · 24 % PV', `energy with PV share (${t['Electricity · today']})`);
    check(t['Defrosts · yesterday'] === '4', 'Lambda defrost tile');
    const small = (await tilesOf(s, ['energy_standby'])).t;
    check(small['Standby · today'] === '0.12 kWh', `small energy keeps two decimals (${small['Standby · today']})`);
    check(t['Electricity heating · week'] === '61.3 kWh', `week from statistics (${t['Electricity heating · week']})`);
    const more = (await tilesOf(s, ['heat_heating', 'cop_total', 'energy_aux', { key: 'cost', period: 'today', price: 0.3 }, { entity: 'sensor.heating_curve_flow', name: 'Curve' },
      { key: 'energy', entity: 'sensor.heatpump_energy_today', name: 'Mine' }, 'spread', 'outdoor', { key: 'cop_heating', period: 'month', name: 'Monthly', decimals: 1 }])).t;
    check(more['Heat heating · today'] === '20.4 kWh', 'Lambda heat tile');
    check(more['COP total · total'] === '≈4.55', `cop_total computed from totals (${more['COP total · total']})`);
    check(!Object.keys(more).some((k) => k.startsWith('Electricity heater')), 'unavailable tile hidden');
    check(/1\.53/.test(more['Cost · today'] || ''), `cost tile (${more['Cost · today']})`);
    check(more.Curve === '33.5 °C' && more.Mine === '5.1 kWh', `free entity tiles (${more.Curve} / ${more.Mine})`);
    check(more.Spread === '4.5 K' && more.Outdoor === '10.4 °C', `live tiles (${more.Spread} / ${more.Outdoor})`);
    check(more.Monthly === '4.6', `name and decimals override (${more.Monthly})`);
  }
  {
    const s = setups[4];
    const { t } = await tilesOf(s, s.config.tiles);
    check(t['COP heating · today'] === '≈4.05', `EMS-ESP COP from statistics (${t['COP heating · today']})`);
    check(t['Electricity heating · today'] === '9.6 kWh', 'EMS-ESP energy today');
    check(t['COP heating · month'] === '≈3.86', `EMS-ESP COP month (${t['COP heating · month']})`);
    check(t['Compressor starts · today'] === '4', `starts from statistics (${t['Compressor starts · today']})`);
    check(t['Runtime per start · today'] === '≈2.5 h', `runtime per start, minutes to hours (${t['Runtime per start · today']})`);
    check(t.Spread === '5.5 K' && t['Heat output'] === '≈6.9 kW', `EMS-ESP live tiles (${t.Spread} / ${t['Heat output']})`);
    const cal = (await tilesOf(s, ['energy_heating:yesterday', 'starts:week', 'cop_heating:year', 'spf'])).t;
    check(cal['Electricity heating · yesterday'] === '12.1 kWh' && cal['Compressor starts · week'] === '31', `statistics yesterday and week (${JSON.stringify(cal)})`);
    check(cal['COP heating · year'] === '≈4.03' && !('SPF (year)' in cal), 'COP year; no SPF without total counters');
    const none = (await tilesOf(s, ['energy_heating', 'energy_heating:total'], 'heat', false)).t;
    check(none['Electricity heating · today'] === '–' && none['Electricity heating · total'] === '4,211 kWh', `missing statistics show a dash (${JSON.stringify(none)})`);
  }
  {
    const s = setups[6];
    const { t } = await tilesOf(s, ['energy', 'env_energy', 'env_energy:month', 'env_energy:total', 'cop_total', 'cop_total:month', 'cop_total:total']);

    check(!e.heat_total && !e.hours && !e.buffer_top && !e.status, `the heat counter, the compressor hours and the reservoir are left out (${e.heat_total} / ${e.buffer_top})`);
    check(!('hc2_pressure' in r.fromPreset), `the system pressure is not copied to circuit 2 (${r.fromPreset.hc2_pressure})`);
    check(JSON.stringify(r.errors) === '["sensor.kronoterm_error_warning_2"]', `error sensor (${JSON.stringify(r.errors)})`);
    check(Object.keys(HFC_PRESETS.kronoterm.mode_map).length === 9 && Object.values(HFC_PRESETS.kronoterm.mode_map).every((m) => m in HFC_I18N.en.modes), 'every working function maps to a card mode');
    // with a thermostat the Cloud loop temperature is the room temperature, never the circuit flow
    const without = (o, id) => Object.fromEntries(Object.entries(o).filter(([k]) => k !== id));
    const inlet = 'sensor.kronoterm_loop_1_inlet_temperature';
    const noInlet = C._resolve({ preset: 'kronoterm' }, hassOf(toStates(without(s.states('heat'), inlet)), without(reg, inlet)));
    check(noInlet.entities.hc_flow === undefined, `loop 1 temperature (the room) is not taken as the circuit flow (${noInlet.entities.hc_flow})`);
    // Modbus: the register-map names are found as well, and the tank sensor comes before the thermostat
    const mbList = [
      ['sensor.kt_working_function', 'working_function', 'dhw'], ['sensor.kt_hp_load', 'hp_load', ['64', '%']],
      ['sensor.kt_hp_outlet_temperature', 'hp_outlet_temperature', ['48.2', '°C']], ['sensor.kt_hp_inlet_temperature', 'hp_inlet_temperature', ['43.0', '°C']],
      ['sensor.kt_dhw_temperature', 'dhw_temperature', ['44.5', '°C']], ['sensor.kt_dhw_current_setpoint', 'dhw_current_setpoint', ['48.0', '°C']],
      ['climate.kt_dhw', 'dhw_temperature', { state: 'heat', attributes: { current_temperature: 44.5, temperature: 50 } }],
      ['sensor.kt_loop_1_temp', 'loop_1_temp', ['31.0', '°C']], ['sensor.kt_loop_2_temp', 'loop_2_temp', ['27.5', '°C']],
      ['sensor.kt_loop_1_thermostat_temperature', 'loop_1_thermostat_temperature', ['21.1', '°C']],
      ['sensor.kt_loop_1_room_current_setpoint', 'loop_1_room_current_setpoint', ['21.5', '°C']],
      ['sensor.kt_operation_program', 'operation_program', 'eco_mode'], ['sensor.kt_error_warning', 'error_warning', 'notice'],
    ];
    const mbStates = toStates(Object.fromEntries(mbList.map(([id, , v]) => [id, v])));
    const mbReg = Object.fromEntries(mbList.map(([id, tk]) => [id, { platform: 'kronoterm', translation_key: tk }]));
    const m = C._resolve({ preset: 'kronoterm', hc_count: 2 }, hassOf(mbStates, mbReg)).entities;
    check(m.dhw_top === 'sensor.kt_dhw_temperature' && m.dhw_target === 'sensor.kt_dhw_current_setpoint', `Modbus: tank sensor and current setpoint (${m.dhw_top} / ${m.dhw_target})`);
    check(m.hc_flow === 'sensor.kt_loop_1_temp' && m.hc2_flow === 'sensor.kt_loop_2_temp' && m.room_target === 'sensor.kt_loop_1_room_current_setpoint', `Modbus: circuit temperatures and room setpoint (${m.hc_flow} / ${m.hc2_flow} / ${m.room_target})`);
    check(m.program === 'sensor.kt_operation_program', 'Modbus without the select: the operation program');
    const mb = mount({ preset: 'kronoterm' }, hassOf(mbStates, mbReg)); await wait(20);
    const errOn = (c) => c.shadowRoot.getElementById('chip-err').classList.contains('on');
    check(!errOn(mb) && mb.shadowRoot.getElementById('chip-program').classList.contains('eco'), 'Modbus notice is no error, eco_mode shows the eco chip');
    mbStates['sensor.kt_error_warning'].state = 'alarm'; mb.hass = { ...mb._hass };
    check(errOn(mb), 'Modbus alarm shows the error chip');
    mb.remove();
    // the card: tank and room from the thermostats, circuit flows, live COP, screen reader label, diagnostic report
    const txt = (c, id) => c.shadowRoot.getElementById(id)?.textContent || '';
    const card = mount({ preset: 'kronoterm', hc_count: 2 }, hassK('heat')); await wait(20);
    check(txt(card, 't-dhw-top') === '49.6 °C' && txt(card, 't-dhw-mode') === 'Target 50 °C', `tank temperature and target from the DHW thermostat (${txt(card, 't-dhw-top')} / ${txt(card, 't-dhw-mode')})`);
    check(txt(card, 't-room') === '22.4 °C' && txt(card, 't-room-target') === 'Target 22.7 °C', `room and target (${txt(card, 't-room')} / ${txt(card, 't-room-target')})`);
    check(/^33\.2 °C/.test(txt(card, 't-hc')) && /^30\.5 °C/.test(txt(card, 't-hc2')), `circuit flows (${txt(card, 't-hc')} / ${txt(card, 't-hc2')})`);
    check(txt(card, 't-hp-cop') === 'COP 3.7' && txt(card, 't-hp-power') === '1,464 W → 5.5 kW', `live COP from heat output and power (${txt(card, 't-hp-cop')} / ${txt(card, 't-hp-power')})`);
    check(!errOn(card) && !card.shadowRoot.getElementById('chip-program').classList.contains('on'), 'no error and no program chip in auto mode');
    const tank = card.shadowRoot.querySelector('#svg [data-entity="climate.kronoterm_dhw_temperature"]');
    check(/^DHW Thermostat: 49\.6 °C$/.test(tank?.getAttribute('aria-label') || ''), `the tank is read out with its temperature (${tank?.getAttribute('aria-label')})`);
    const report = C._diagnosticReport({ preset: 'kronoterm', hc_count: 2 }, card._hass);
    check(/- dhw_top: climate\.kronoterm_dhw_temperature = heat \(current_temperature 49\.6\)/.test(report) && /- dhw_target: climate\.kronoterm_dhw_temperature = heat \(temperature 50\)/.test(report), 'diagnostic report shows the thermostat temperatures');
    check(/Preset: kronoterm/.test(report) && /Preset detected: yes/.test(report), 'diagnostic report names the Kronoterm preset');
    card.remove();
    // hot water: the circulator moves the valve; defrost: the defrost entity wins over the heating mode
    const dhw = mount({ preset: 'kronoterm', hc_count: 2 }, hassK('dhw')); await wait(20);
    check(txt(dhw, 'chip-mode').startsWith('Hot water') && dhw.shadowRoot.getElementById('p-vl-dhw').classList.contains('on') && !dhw.shadowRoot.getElementById('p-hc-vl').classList.contains('on'), `hot water run (${txt(dhw, 'chip-mode')})`);
    dhw.remove();
    const df = mount({ preset: 'kronoterm', hc_count: 2 }, hassK('defrost')); await wait(20);
    check(txt(df, 'chip-mode').startsWith('Defrost') && df.shadowRoot.getElementById('hp-box').classList.contains('defrost') && df.shadowRoot.getElementById('fan').classList.contains('on'), `defrost entity wins over the heating mode (${txt(df, 'chip-mode')})`);
    df.remove();
    const idle = mount({ preset: 'kronoterm', hc_count: 2 }, hassK('idle')); await wait(20);
    check(txt(idle, 'chip-mode').startsWith('Standby') && errOn(idle) && idle.shadowRoot.getElementById('chip-program').classList.contains('eco'), `standby with a warning in eco mode (${txt(idle, 'chip-mode')})`);
    idle.remove();
    // tiles: electricity per use today, the month from the total counter, COP total from the SCOP, starts as totals
    const { t } = await tilesOf(s, ['energy', 'energy_heating', 'energy:month', 'cop_total', 'cycles_heating', 'cycles_dhw', 'cop_heating']);
    check(t['Electricity · today'] === '27.4 kWh' && t['Electricity heating · today'] === '21.6 kWh' && t['Electricity · month'] === '513 kWh', `Kronoterm electricity tiles (${JSON.stringify(t)})`);
    check(t['COP total · total'] === '3.43' && t['Heating cycles · total'] === '12,245' && t['DHW cycles · total'] === '641' && !Object.keys(t).some((k) => k.startsWith('COP heating')), `Kronoterm COP and cycle tiles (${JSON.stringify(t)})`);
    // the hot water heat pumps of the Kronoterm DHW cloud and the same keys of another integration are not detected
    check(!detects('kronoterm', { 'sensor.kronoterm_dhw_current_temperature': '48', 'sensor.kronoterm_dhw_compressor_status': 'running' },
      { 'sensor.kronoterm_dhw_current_temperature': { platform: 'kronoterm', translation_key: 'dhw_current_temperature' }, 'sensor.kronoterm_dhw_compressor_status': { platform: 'kronoterm', translation_key: 'dhw_compressor_status' } }), 'a Kronoterm hot water heat pump is not taken for a heating heat pump');
    check(!detects('kronoterm', { 'sensor.x_working_function': 'heating' }, { 'sensor.x_working_function': { platform: 'other', translation_key: 'working_function' } }), 'working_function of another integration is not Kronoterm');
  }

  // 18f. thermostat and water heater entities as temperature sources in any configuration
  {
    const states = toStates({
      'sensor.m': 'Heating', 'sensor.f': ['31', '°C'], 'sensor.r': ['27', '°C'],
      'water_heater.tank': { state: 'eco', attributes: { current_temperature: 47.5, temperature: 52 } },
      'climate.living': { state: 'heat', attributes: { current_temperature: 21.3, temperature: 21.5 } },
      'climate.floor': { state: 'heat', attributes: { current_temperature: 29.0, temperature: 30.5 } },
    });
    const cfg = { mode_map: { Heating: 'heating' }, entities: { mode: 'sensor.m', flow: 'sensor.f', return: 'sensor.r', dhw_top: 'water_heater.tank', dhw_target: 'water_heater.tank',
      room: 'climate.living', room_target: 'climate.living', hc_flow: 'climate.floor', hc_setpoint: 'climate.floor' } };
    const c = mount(cfg, hassOf(states)); await wait(20);
    const txt = (id) => c.shadowRoot.getElementById(id)?.textContent || '';
    check(txt('t-dhw-top') === '47.5 °C' && txt('t-dhw-mode') === 'Target 52 °C', `water heater: current temperature and target (${txt('t-dhw-top')} / ${txt('t-dhw-mode')})`);
    check(txt('t-room') === '21.3 °C' && txt('t-room-target') === 'Target 21.5 °C' && txt('t-hc') === '29.0 °C · Target 30.5', `climate: current temperature and target (${txt('t-room')} / ${txt('t-room-target')} / ${txt('t-hc')})`);
    states['water_heater.tank'].attributes = {}; c.hass = { ...c._hass };
    check(txt('t-dhw-top') === '– °C' && ok(c), 'a water heater without temperatures shows a dash');
    c.remove();
  }

  // 18g. HeishaMon: power and heat from the integration totals, which include hot water
  {
    const p = 'panasonic_heat_pump';
    const dhw = {
      [`sensor.${p}_main_main_outlet_temp`]: ['39.75', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['37', '°C'],
      [`sensor.${p}_main_threeway_valve_state`]: 'Tank', [`sensor.${p}_main_compressor_freq`]: ['48', 'Hz'],
      [`sensor.${p}_main_heat_power_consumption`]: ['0', 'W'], [`sensor.${p}_main_heat_power_production`]: ['0', 'W'],
      [`sensor.${p}_main_dhw_power_consumption`]: ['1000', 'W'], [`sensor.${p}_main_dhw_power_production`]: ['3800', 'W'],
      [`sensor.${p}_consumption`]: ['1000.0', 'W'], [`sensor.${p}_production`]: ['3800.0', 'W'],
    };
    const r = C._resolve({ preset: 'heishamon' }, hassOf(toStates(dhw)));
    check(r.entities.power === `sensor.${p}_consumption` && r.entities.heat === `sensor.${p}_production`, `HeishaMon uses the total power sensors (${r.entities.power}, ${r.entities.heat})`);
    check(r.tiles.energy_heating?.now === `sensor.${p}_main_heat_power_consumption` && r.tiles.energy_dhw?.now === `sensor.${p}_main_dhw_power_consumption`, 'HeishaMon tiles keep the power per mode');
    const card = mount({ preset: 'heishamon' }, hassOf(toStates(dhw))); await wait(20);
    check(card._w('power') === 1000 && card._kw('heat') === 3.8, `HeishaMon shows power and heat while the valve is on the tank (${card._w('power')} W, ${card._kw('heat')} kW)`);
    card.remove();
    const old = { ...dhw };
    delete old[`sensor.${p}_consumption`]; delete old[`sensor.${p}_production`];
    const o = C._resolve({ preset: 'heishamon' }, hassOf(toStates(old)));
    check(o.entities.power === `sensor.${p}_main_heat_power_consumption` && o.entities.heat === `sensor.${p}_main_heat_power_production`, 'HeishaMon without totals keeps the heating power sensors');
    const other = Object.fromEntries(Object.entries(dhw).map(([k, v]) => [k.replace(p, 'aquarea2'), v]));
    const a = C._resolve({ preset: 'heishamon' }, hassOf(toStates(other)));
    check(a.entities.power === 'sensor.aquarea2_consumption', `HeishaMon totals follow the detected prefix (${a.entities.power})`);
  }

  // 18h. HeishaMon: room temperature depends on the zone sensor setting
  {
    const p = 'panasonic_heat_pump';
    const base = {
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32.5', '°C'],
      [`sensor.${p}_main_z1_temp`]: ['35', '°C'], [`sensor.${p}_main_room_thermostat_temp`]: ['23', '°C'],
    };
    const room = (setting, states = base) => C._resolve({ preset: 'heishamon' }, hassOf(toStates(setting === undefined ? states
      : { ...states, [`sensor.${p}_main_z1_sensor_settings`]: setting }))).entities.room;
    check(room('Water Temperature') === `sensor.${p}_main_room_thermostat_temp`, 'HeishaMon water temperature setting: room from the remote control');
    check(room('External Thermostat') === `sensor.${p}_main_room_thermostat_temp`, 'HeishaMon external thermostat setting: room from the remote control');
    check(room('Internal Thermostat') === `sensor.${p}_main_z1_temp`, 'HeishaMon internal thermostat setting: room from the zone');
    check(room('Thermistor') === `sensor.${p}_main_z1_temp`, 'HeishaMon thermistor setting: room from the zone');
    check(room(undefined) === `sensor.${p}_main_room_thermostat_temp`, 'HeishaMon without zone sensor setting: room from the remote control');
    const noRemote = { ...base }; delete noRemote[`sensor.${p}_main_room_thermostat_temp`];
    check(room('Water Temperature', noRemote) === `sensor.${p}_main_z1_temp`, 'HeishaMon without remote control sensor keeps the zone temperature');
    const card = mount({ preset: 'heishamon' }, hassOf(toStates({ ...base, [`sensor.${p}_main_z1_sensor_settings`]: 'Water Temperature' }))); await wait(20);
    check(card._n('room') === 23, `HeishaMon card shows the room temperature, not the zone water (${card._n('room')})`);
  }

  // 18j. HeishaMon defrost: the compressor pauses while the 4-way valve switches; the card stays in defrost
  {
    const p = 'panasonic_heat_pump';
    const st = (comp) => toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['28.5', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['31.75', '°C'],
      [`sensor.${p}_main_compressor_freq`]: [comp, 'Hz'], [`sensor.${p}_main_heat_power_consumption`]: [comp === '0' ? '0' : '1200', 'W'],
      [`sensor.${p}_main_pump_flow`]: ['16.6', 'L/min'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`switch.${p}_main_defrosting_state`]: 'on',
    });
    const card = mount({ preset: 'heishamon' }, hassOf(st('35'))); await wait(20);
    const chip = () => card.shadowRoot.getElementById('chip-mode');
    check(/mode-defrost/.test(chip().className), `defrost with the compressor running (${chip().className})`);
    card.hass = hassOf(st('0')); await wait(5);
    check(/mode-defrost/.test(chip().className) && !/Standby|Ready|idle/i.test(chip().textContent), `defrost stays while the compressor pauses (${chip().textContent.trim()})`);
    card.remove();
  }

  // 18e. HeishaMon: error sensor, kWh counters, zone water temperature without a zone sensor (real installation, WH-MDC05J3E5)
  {
    const p = 'panasonic_heat_pump';
    const st = {
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32.25', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_z1_water_temp`]: ['-78', '°C'], [`sensor.${p}_main_error`]: 'No error',
      [`sensor.${p}_main_heat_power_consumption`]: ['600', 'W'], [`sensor.${p}_main_heat_power_production`]: ['2600', 'W'],
      [`sensor.${p}_main_dhw_power_consumption`]: ['0', 'W'], [`sensor.${p}_main_dhw_power_production`]: ['0', 'W'],
      'sensor.aquarea_pump_total_consumption_total': ['7690.574', 'kWh'], 'sensor.aquarea_pump_total_production_total': ['24276.876', 'kWh'],
      'sensor.aquarea_heat_power_consumed_total': ['6636.338', 'kWh'], 'sensor.aquarea_heat_power_produced_total': ['21509.845', 'kWh'],
      'sensor.aquarea_dhw_power_consumed_total': ['1054.239', 'kWh'], 'sensor.aquarea_dhw_power_produced_total': ['2767.033', 'kWh'],
    };
    const r = C._resolve({ preset: 'heishamon' }, hassOf(toStates(st)));
    check(JSON.stringify(r.errors) === JSON.stringify([`sensor.${p}_main_error`]), `HeishaMon error sensor (${r.errors})`);
    check(r.entities.energy_total === 'sensor.aquarea_pump_total_consumption_total' && r.entities.heat_total === 'sensor.aquarea_pump_total_production_total', 'HeishaMon kWh totals');
    check(r.tiles.energy?.total === 'sensor.aquarea_pump_total_consumption_total' && r.tiles.heat?.total === 'sensor.aquarea_pump_total_production_total', 'HeishaMon totals feed the energy and heat tiles');
    check(r.tiles.energy_heating?.total === 'sensor.aquarea_heat_power_consumed_total' && r.tiles.heat_dhw?.total === 'sensor.aquarea_dhw_power_produced_total'
      && r.tiles.energy_heating?.now === `sensor.${p}_main_heat_power_consumption`, 'HeishaMon tiles per mode: now and total');
    check(!r.tiles.energy_cooling?.total, 'HeishaMon without cooling counters has no cooling total');
    check(r.entities.hc_flow === undefined, `HeishaMon ignores the zone water temperature without a zone sensor (${r.entities.hc_flow})`);
    const zone = C._resolve({ preset: 'heishamon' }, hassOf(toStates({ ...st, [`sensor.${p}_main_z1_water_temp`]: ['33', '°C'] })));
    check(zone.entities.hc_flow === `sensor.${p}_main_z1_water_temp`, 'HeishaMon keeps a valid zone water temperature');
    const card = mount({ preset: 'heishamon' }, hassOf(toStates(st))); await wait(20);
    const errOn = () => card.shadowRoot.getElementById('chip-err').classList.contains('on');
    check(!errOn(), 'HeishaMon "No error" shows no error chip');
    check(JSON.parse(card._layoutSignature()).hc === true, 'HeishaMon circuit stays drawn as a direct system');
    card.hass = hassOf(toStates({ ...st, [`sensor.${p}_main_error`]: 'H76' })); await wait(5);
    check(errOn(), 'HeishaMon error code H76 shows the error chip');
    card.remove();
  }

  // 18i. an entity list adds the values, e.g. two S0 meters of HeishaMon as the heat pump power
  {
    const p = 'panasonic_heat_pump';
    const states = {
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32.5', '°C'],
      [`sensor.${p}_main_heat_power_consumption`]: ['400', 'W'], [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'],
      [`sensor.${p}_s0_watt_1`]: ['581', 'W'], [`sensor.${p}_s0_watt_2`]: ['1.5', 'kW'],
    };
    const s0 = [`sensor.${p}_s0_watt_1`, `sensor.${p}_s0_watt_2`];
    const cfg = { preset: 'heishamon', entities: { power: s0 } };
    const r = C._resolve(cfg, hassOf(toStates(states)));
    check(r.entities.power === s0[0] && JSON.stringify(r.sums.power) === JSON.stringify(s0), `entity list: first entity stands for the key, all are summed (${r.entities.power})`);
    const single = C._resolve({ preset: 'heishamon', entities: { power: [s0[0]] } }, hassOf(toStates(states)));
    check(single.entities.power === s0[0] && !single.sums.power, 'entity list with one entity is a plain entity');
    const card = mount(cfg, hassOf(toStates(states))); await wait(20);
    check(card._w('power') === 2081, `entity list sums W and kW (${card._w('power')} W)`);
    card.hass = hassOf(toStates({ ...states, [s0[1]]: 'unavailable' })); await wait(5);
    check(card._w('power') === 581, `entity list skips a member without a number (${card._w('power')} W)`);
    card.hass = hassOf(toStates({ ...states, [s0[0]]: 'unavailable', [s0[1]]: 'unknown' })); await wait(5);
    check(Number.isNaN(card._w('power')), 'entity list without any number gives no value');
    card.remove();
    const kw = mount({ preset: 'heishamon' }, hassOf(toStates({ ...states, [`sensor.${p}_main_heat_power_production`]: ['3800', 'W'] }))); await wait(20);
    check(kw._kw('heat') === 3.8, `W to kW conversion stays exact (${kw._kw('heat')} kW)`);
    kw.remove();
    const report = C._diagnosticReport(cfg, hassOf(toStates(states)));
    check(report.includes(`- power (sum 1): ${s0[0]} = 581 W`) && report.includes(`- power (sum 2): ${s0[1]} = 1.5 kW`), 'diagnostic report lists every member of the sum');
    const flat = (list) => list.flatMap((x) => (x.schema ? flat(x.schema) : [x]));
    const find = (list) => flat(list).find((x) => x.name === 'power');
    check(find(C._formSchema(cfg).schema)?.selector?.entity?.multiple === true, 'editor shows a picker for several entities for a list');
    check(!find(C._formSchema({ preset: 'heishamon' }).schema)?.selector?.entity?.multiple, 'editor keeps the single picker without a list');
  }

  // 18f. HeishaMon: refrigerant temperatures and the superheat computed from them
  {
    const p = 'panasonic_heat_pump';
    const st = {
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32.25', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_discharge_temp`]: ['49', '°C'],
      [`sensor.${p}_main_outside_pipe_temp`]: ['1', '°C'], [`sensor.${p}_main_eva_outlet_temp`]: ['3', '°C'],
      [`sensor.${p}_main_inside_pipe_temp`]: ['32', '°C'],
    };
    const r = C._resolve({ preset: 'heishamon' }, hassOf(toStates(st)));
    check(r.entities.evap_temp === `sensor.${p}_main_outside_pipe_temp` && r.entities.suction_temp === `sensor.${p}_main_eva_outlet_temp`
      && r.entities.liquid_temp === `sensor.${p}_main_inside_pipe_temp`, 'HeishaMon refrigerant temperatures');
    const card = mount({ preset: 'heishamon' }, hassOf(toStates(st))); await wait(20);
    const rows = card._drawerRows().flatMap(([, list]) => list);
    const sh = rows.find((x) => x[0] === 'superheat');
    check(sh && sh[3]() === '2.0 K', `HeishaMon superheat from suction gas and evaporation (${sh && sh[3] ? sh[3]() : 'none'})`);
    card.remove();
    // In defrost the circuit runs backwards: the outdoor pipe is no evaporation temperature then.
    const value = (c, key) => c._drawerRows().flatMap(([, list]) => list).find((x) => x[0] === key)?.[3]();
    const defrost = mount({ preset: 'heishamon' }, hassOf(toStates({ ...st, [`switch.${p}_main_defrosting_state`]: 'on' }))); await wait(20);
    check(['evap_temp', 'suction_temp', 'liquid_temp', 'superheat'].every((k) => value(defrost, k) === '–') && /49/.test(value(defrost, 'hot_gas')),
      `HeishaMon defrost hides the heating-only refrigerant roles (${['evap_temp', 'superheat', 'hot_gas'].map((k) => value(defrost, k)).join(', ')})`);
    defrost.hass = hassOf(toStates({ ...st, [`switch.${p}_main_defrosting_state`]: 'off' })); await wait(5);
    check(value(defrost, 'superheat') === '2.0 K' && /1/.test(value(defrost, 'evap_temp')), 'after defrost the roles come back');
    defrost.remove();
    const own = mount({ preset: 'heishamon', entities: { evap_temp: `sensor.${p}_main_outside_pipe_temp` } }, hassOf(toStates({ ...st, [`switch.${p}_main_defrosting_state`]: 'on' }))); await wait(20);
    check(value(own, 'evap_temp') !== '–' && value(own, 'suction_temp') === '–', 'an entity set in the config keeps its value in defrost');
    own.remove();
  }

  // 19. diagnostic report, full-screen layer, custom texts and built-in card themes
  {
    const s = setups[0];
    const h = hassOf(toStates(s.states('heat')), s.registry || {}, null, s);
    h.config = { version: '2026.10.1', time_zone: 'Europe/Vienna' };
    const report = C._diagnosticReport(s.config, h);
    check(/Privacy: entity ids can contain personal names/.test(report) && /Card version: \d+\.\d+\.\d+/.test(report) && /Home Assistant: 2026\.10\.1/.test(report), 'diagnostic report identifies itself and starts with the privacy warning');
    check(/Loaded from: \S+/.test(report), 'diagnostic report names the file the card was loaded from');
    check(/- flow: sensor\.eu08l_hp1_flow_line_temperature = 32\.4/.test(report) && /- hc3_flow: not mapped/.test(report), 'diagnostic report contains mapped states and missing keys');
    check(/Preset: lambda/.test(report) && /Preset detected: yes/.test(report) && /Quick controls:/.test(report) && !/friendly_name/.test(report), 'diagnostic report contains detection and controls but no attribute dump');
    const card = mount(s.config, h); await wait(20);
    let copied = '';
    card._writeClipboard = async (text) => { copied = text; };
    card.shadowRoot.getElementById('diagnostic-copy').click(); await wait(0);
    check(copied === report && /copied/i.test(card.shadowRoot.getElementById('tool-status').textContent), 'diagnostic button copies the local report and announces success');

    const oldOverflow = document.body.style.overflow;
    card.shadowRoot.getElementById('fullscreen-toggle').click();
    let shell = card.shadowRoot.querySelector('ha-card');
    check(shell.classList.contains('fullscreen') && shell.getAttribute('role') === 'dialog' && shell.getAttribute('aria-modal') === 'true'
      && !card.shadowRoot.getElementById('fullscreen-backdrop').hidden && document.body.style.overflow === 'hidden', 'full-screen opens one modal card layer and locks background scrolling');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    shell = card.shadowRoot.querySelector('ha-card');
    check(!shell.classList.contains('fullscreen') && card.shadowRoot.getElementById('fullscreen-backdrop').hidden
      && document.body.style.overflow === oldOverflow && card.shadowRoot.activeElement?.id === 'fullscreen-toggle', 'Escape closes full-screen and returns focus to its button');
    card.shadowRoot.getElementById('fullscreen-toggle').click();
    card.shadowRoot.getElementById('fullscreen-backdrop').click();
    check(!card.shadowRoot.querySelector('ha-card').classList.contains('fullscreen'), 'a backdrop click closes full-screen');
    card.remove();
    const noFull = mount({ ...s.config, fullscreen: false }, h);
    check(!noFull.shadowRoot.getElementById('fullscreen-toggle'), 'fullscreen: false removes the button');
    noFull.remove();

    const custom = { ...s.config, title: undefined, language: 'nl', texts: { nl: {
      title: 'Warmtepomp & huis', heat_pump: 'Warm <bron>', details: 'Details NL',
      modes: { heating: 'Verwarming' }, tiles: { spread: 'Verschil' },
    } } };
    const nl = mount(custom, { ...h, locale: { language: 'nl-NL' }, language: 'nl-NL' }); await wait(20);
    check(nl._lang === 'nl' && nl.shadowRoot.querySelector('.title').textContent === 'Warmtepomp & huis'
      && nl.shadowRoot.querySelector('.unit-title').textContent === 'Warm <bron>' && !nl.shadowRoot.querySelector('.unit-title').querySelector('bron'), 'custom language renders escaped labels');
    check(nl.shadowRoot.getElementById('chip-mode').textContent.startsWith('Verwarming')
      && nl.shadowRoot.getElementById('drawer-toggle').textContent.startsWith('Details NL') && nl._i.compressor_off === 'Compressor off', 'custom texts merge recursively and missing labels fall back to English');
    const tileOptions = C._tileOptions(custom, C._resolve(custom, h), h).options;
    check(tileOptions.some((o) => o.value === 'spread' && o.label === 'Verschil'), 'custom tile labels reach the editor options');
    nl.remove();

    for (const theme of ['auto', 'night', 'contrast']) {
      const themed = mount({ ...s.config, theme }, h); await wait(10);
      check(themed.shadowRoot.querySelector('ha-card').classList.contains(`theme-${theme}`), `theme ${theme} renders`);
      if (theme === 'night') check(getComputedStyle(themed.shadowRoot.querySelector('ha-card')).getPropertyValue('--card-background-color').trim() === '#111827', 'night theme supplies its dim surface');
      if (theme === 'contrast') check(getComputedStyle(themed.shadowRoot.querySelector('ha-card')).getPropertyValue('--divider-color').trim() === '#000', 'contrast theme supplies strong outlines');
      themed.remove();
    }
    const keysOf = (n) => (n.schema ? n.schema.flatMap(keysOf) : [n.name]);
    const schema = C._formSchema(custom).schema;
    check(['theme', 'fullscreen', 'language'].every((key) => schema.flatMap(keysOf).includes(key)), 'editor offers theme, full-screen and language controls');
    const languageField = (() => { let found; const visit = (n) => { if (n.name === 'language') found = n; (n.schema || []).forEach(visit); }; schema.forEach(visit); return found; })();
    check(languageField.selector.select.options.some((o) => o.value === 'nl'), 'editor language selector includes configured custom languages');
    const ed = document.createElement('heatpump-flow-card-editor'); let changed;
    ed.addEventListener('config-changed', (ev) => { changed = ev.detail.config; });
    ed.setConfig(custom); ed.hass = h; await wait(10);
    ed._changed({ preset: 'lambda', language: 'nl', theme: 'night', fullscreen: false, entities: ed._form.data.entities });
    check(changed.texts.nl.title === 'Warmtepomp & huis' && changed.theme === 'night' && changed.fullscreen === false, 'editor preserves YAML translations and writes theme/full-screen options');
    ed.remove();
  }

  // 20. hydraulic pressure, three-point storage gradients, defrost vapour and column radiators
  {
    const states = toStates({
      'sensor.mode': 'defrost', 'sensor.flow': ['35', '°C'], 'sensor.return': ['29', '°C'], 'sensor.dhw_top': ['52', '°C'],
      'sensor.dhw_middle': ['44', '°C'], 'sensor.dhw_bottom': ['36', '°C'], 'sensor.buffer_top': ['34', '°C'],
      'sensor.buffer_middle': ['30', '°C'], 'sensor.buffer_bottom': ['26', '°C'], 'sensor.brine_pressure': ['82', 'kPa'],
      'sensor.heating_pressure': ['0.6', 'bar'], 'binary_sensor.pump': 'on',
    });
    const config = {
      source_type: 'brine', hc_type: 'column', details_open: true, tiles: ['brine_pressure', 'hc_pressure'],
      brine_pressure_min: 0.9, brine_pressure_crit: 0.6, brine_pressure_max: 2.5,
      hc_pressure_min: 1.0, hc_pressure_crit: 0.7, hc_pressure_max: 2.8,
      entities: { mode: 'sensor.mode', flow: 'sensor.flow', return: 'sensor.return', hc_pump: 'binary_sensor.pump',
        dhw_top: 'sensor.dhw_top', dhw_middle: 'sensor.dhw_middle', dhw_bottom: 'sensor.dhw_bottom',
        buffer_top: 'sensor.buffer_top', buffer_middle: 'sensor.buffer_middle', buffer_bottom: 'sensor.buffer_bottom',
        brine_pressure: 'sensor.brine_pressure', hc_pressure: 'sensor.heating_pressure' },
    };
    const card = mount(config, hassOf(states)); await wait(30);
    check(ok(card) && card.shadowRoot.querySelectorAll('.column-rib').length === 7, 'column radiator renders seven joined sections');
    check(card._pressure('brine_pressure') === 0.82, 'pressure converts kPa to bar');
    check(card.shadowRoot.getElementById('pressure-brine').classList.contains('warning') && /^! /.test(card.shadowRoot.getElementById('t-brine-pressure').textContent), 'brine pressure shows a non-colour warning');
    check(card.shadowRoot.getElementById('pressure-hc').classList.contains('critical') && /^⚠ /.test(card.shadowRoot.getElementById('t-hc-pressure').textContent), 'heating pressure shows a non-colour critical state');
    check(/bar/.test(card.shadowRoot.getElementById('pressure-hc').getAttribute('aria-label') || '') && /critical/.test(card.shadowRoot.getElementById('pressure-hc').getAttribute('aria-label') || ''), 'pressure accessibility label includes value and state');
    check(card.shadowRoot.querySelectorAll('#stats .stat').length === 2 && /0\.8 bar/.test(card.shadowRoot.getElementById('stats').textContent), 'pressure values are available as live tiles');
    check([...card.shadowRoot.querySelectorAll('#drawer-body .dsec-title')].some((x) => /Hydraulic/.test(x.textContent)) && /0\.6 bar/.test(card.shadowRoot.getElementById('drawer-body').textContent), 'pressure values are available in details');
    check(!!card.shadowRoot.getElementById('g-dhw-middle') && !!card.shadowRoot.getElementById('g-buf-middle')
      && /middle 44/.test(card.shadowRoot.getElementById('t-dhw-middle').textContent) && /middle 30/.test(card.shadowRoot.getElementById('t-buf-middle').textContent), 'middle sensors create labelled three-point tank gradients');
    card.remove();

    const old = setups[1];
    const twoPoint = mount(old.config, hassOf(toStates(old.states('heat')), old.registry || {}, old.energy, old)); await wait(20);
    check(!twoPoint.shadowRoot.getElementById('g-dhw-middle') && !twoPoint.shadowRoot.getElementById('g-buf-middle'), 'existing two-sensor tanks keep two-point gradients');
    twoPoint.remove();

    for (const unit_style of ['generic', 'lambda', 'vaillant', 'panasonic', 'viessmann', 'bosch', 'saunier', 'samsung']) {
      const s = setups[0]; const vapour = mount({ ...s.config, unit_style }, hassOf(toStates(s.states('defrost')), s.registry || {}, s.energy, s)); await wait(20);
      check(vapour.shadowRoot.getElementById('vapour')?.classList.contains('on'), `defrost vapour works with ${unit_style} unit`);
      vapour.remove();
    }
    const airHeat = mount(setups[0].config, hassOf(toStates(setups[0].states('heat')))); await wait(20);
    check(!airHeat.shadowRoot.getElementById('vapour').classList.contains('on'), 'vapour is off outside defrost');
    const css = airHeat.shadowRoot.querySelector('style').textContent;
    check(/motion-off[^}]*vapour/.test(css) && /prefers-reduced-motion[\s\S]*vapour/.test(css), 'vapour respects animation and reduced-motion settings');
    airHeat.remove();
    const ground = setups[6]; const noGroundVapour = mount(ground.config, hassOf(toStates(ground.states('defrost')), ground.registry || {}, ground.energy, ground)); await wait(20);
    check(!noGroundVapour.shadowRoot.getElementById('vapour')?.classList.contains('on'), 'ground source does not show defrost vapour');
    noGroundVapour.remove();

    const keysOf = (n) => (n.schema ? n.schema.flatMap(keysOf) : [n.name]);
    const schema = C._formSchema({}).schema;
    check(['env_energy', 'brine_pressure_min', 'brine_pressure_crit', 'brine_pressure_max', 'hc_pressure_min', 'hc_pressure_crit', 'hc_pressure_max'].every((key) => schema.flatMap(keysOf).includes(key)), 'editor offers environmental energy and pressure thresholds');
    const emitter = (() => { let found; const visit = (n) => { if (n.name === 'hc_type') found = n; (n.schema || []).forEach(visit); }; schema.forEach(visit); return found; })();
    check(emitter.selector.select.options.some((o) => o.value === 'column'), 'editor offers column radiators');
  }

  // 20b. DHW tank with only a sensor near the bottom (HeishaMon has one tank sensor; its position depends on the tank)
  {
    const states = toStates({ 'sensor.flow': ['35', '°C'], 'sensor.return': ['30', '°C'], 'sensor.dhw': ['37', '°C'] });
    const card = mount({ entities: { flow: 'sensor.flow', return: 'sensor.return', dhw_bottom: 'sensor.dhw' } }, hassOf(states)); await wait(20);
    const $ = (id) => card.shadowRoot.getElementById(id);
    check(ok(card) && !!card.shadowRoot.querySelector('rect.tank'), 'DHW tank is drawn with only a bottom sensor');
    check($('t-dhw-top').textContent === '' && $('t-dhw-bottom').textContent === card._t(37), `the value shows at the bottom without a position label (${$('t-dhw-bottom').textContent})`);
    check($('g-dhw-top').getAttribute('stop-color') === $('g-dhw-bottom').getAttribute('stop-color'), 'the tank colour comes from the bottom sensor');
    check(card.shadowRoot.querySelector('rect.tank').closest('.tap')?.getAttribute('data-entity') === 'sensor.dhw', 'tapping the tank opens the bottom sensor');
    card.remove();
    const preset = mount({ preset: 'heishamon', entities: { dhw_top: null, dhw_bottom: 'sensor.panasonic_heat_pump_main_dhw_temp' } }, hassOf(toStates({
      'sensor.panasonic_heat_pump_main_main_outlet_temp': ['36', '°C'], 'sensor.panasonic_heat_pump_main_main_inlet_temp': ['32', '°C'],
      'sensor.panasonic_heat_pump_main_dhw_temp': ['37', '°C'],
    }))); await wait(20);
    check(!preset._has('dhw_top') && /37/.test(preset.shadowRoot.getElementById('t-dhw-bottom').textContent), 'a preset sensor can be moved from top to bottom in the config');
    preset.remove();
  }

  log.push(`${checks} checks, ${fails.length} failed`);
  document.getElementById('log').textContent = [...log, ...fails.map((f) => `FAIL ${f}`)].join('\n');
  document.getElementById('result').textContent = fails.length ? 'FAIL' : 'PASS';
  document.title = fails.length ? `FAIL: ${fails[0]}` : `PASS: ${checks} checks`;
})().catch((e) => {
  const message = String(e && e.stack || e);
  document.getElementById('result').textContent = 'FAIL'; document.getElementById('log').textContent = message;
  document.title = `FAIL: ${message.split('\n')[0]}`;
});
</script>
</body>
</html>
