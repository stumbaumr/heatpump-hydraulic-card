<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heatpump Flow Card – self-test</title>
<!--
  Runs in a headless browser (see .github/workflows/validate.yml):
  every demo installation in every scenario, broken entity states, edge-case configs,
  preset detection (including gas boilers that must not be taken for heat pumps) and the computed values.
  Result: <pre id="result">PASS</pre> or FAIL with the failed checks.
-->
</head>
<body>
<pre id="result">RUNNING</pre>
<pre id="log"></pre>
<script src="../dist/heatpump-hydraulic-card.js"></script>
<script src="../demo/setups.js"></script>
<script>
(async () => {
  const C = customElements.get('heatpump-flow-card');
  const fails = []; const log = []; let checks = 0;
  const check = (ok, label) => { checks++; if (!ok) fails.push(label); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Same state format as the demo: value, [value, unit] or {state, attributes}.
  const toStates = (obj) => {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v && typeof v === 'object' && !Array.isArray(v)) { out[k] = { entity_id: k, attributes: {}, ...v }; continue; }
      const [state, unit] = Array.isArray(v) ? v : [v];
      out[k] = { entity_id: k, state, attributes: unit ? { unit_of_measurement: unit } : {} };
    }
    return out;
  };
  const hassOf = (states, registry = {}, energy, setup = {}) => ({
    states, entities: registry, locale: { language: 'en' }, language: 'en',
    callWS: (m) => (m.type === 'recorder/statistic_during_period' ? statChange(setup, m)
      : m.type === 'history/history_during_period' && setup.states ? historySim(setup, m)
      : m.type === 'energy/get_prefs' && energy ? Promise.resolve(energy) : Promise.reject(new Error('n/a'))),
    callService: () => Promise.resolve(),
  });
  const mount = (config, hass) => {
    C._energyPrefs = null;
    const card = document.createElement('heatpump-flow-card');
    card.setConfig(config);
    document.body.appendChild(card);
    card.hass = hass; card.hass = { ...hass };
    return card;
  };
  // Rendered without an error: the drawing, or the start state of a card without preset and entities (#142).
  const ok = (card) => !card._failed && (!!card.shadowRoot.getElementById('svg') || !!card.shadowRoot.getElementById('start-hint'));

  // 1. every installation and scenario renders, presets are detected
  for (const [i, s] of setups.entries()) {
    for (const [scen] of scenarios) {
      const card = mount(s.config, hassOf(toStates(s.states(scen)), s.registry || {}, s.energy, s));
      await wait(5);
      check(ok(card), `render ${i}/${scen}`);
      check(card.shadowRoot.getElementById('chip-mode')?.textContent.trim().length > 0, `mode chip ${i}/${scen}`);
      if (s.config.preset) check(!card._needsBuild, `preset detected ${i}/${scen}`);
      card.remove();
    }
  }

  // 2. broken states never break the card
  const variants = ['unavailable', 'unknown', '', 'abc', '-999', '1e9', 'NaN'];
  for (const [i, s] of setups.entries()) {
    const base = toStates(s.states('heat'));
    for (const v of variants) {
      const broken = {}; for (const [k, o] of Object.entries(base)) broken[k] = { ...o, state: v, attributes: v === '' ? {} : o.attributes };
      const card = mount(s.config, hassOf(broken, s.registry || {}));
      check(ok(card), `broken state "${v}" in setup ${i}`);
      card.remove();
    }
  }

  // 3. edge-case configs
  const edge = [{}, { preset: 'none' }, { entities: { flow: 'sensor.nope', power: 'sensor.nope2' } }, { hc_count: 3, hc2_type: 'radiator' },
    { hc_count: '7' }, { controls: ['switch.nope', { entity: 'select.nope' }, null, 5] }, { details: ['sensor.nope', null] },
    { badges: [{ entity: 'x' }] }, { stats: [{ entity: 'sensor.nope' }] }, { source_type: 'brine' },
    { source_type: 'water', entities: { heater: 'sensor.h', dhw_heater: 'sensor.d' } }, { preset: 'lambda' },
    { tiles: [null, {}, 'spread', { entity: 'sensor.nope' }] }, { preset: 'lambda', tiles: ['cop_heating:year', 'load_classes', 'cost'] }];
  for (const cfg of edge) { const card = mount(cfg, hassOf(toStates({ 'sensor.h': '7', 'sensor.d': 'weird' }))); check(ok(card), `edge config ${JSON.stringify(cfg)}`); card.remove(); }

  // 4. invalid configs give a readable error
  for (const cfg of [{ preset: 'foo' }, { hc_type: 'x' }, { source_type: 'lava' }, null, { tiles: ['nope'] }, { tiles: ['cop_heating:fortnight'] }, { tiles: 'cop_heating' },
    { price: { v: 1 } }, { tiles: [{ key: 'spread', tap_action: 'navigate' }] }, { stats: [{ entity: 'sensor.x', hold_action: true }] },
    { layout: 'huge' }, { actions: [] }, { actions: { mode: 'navigate' } }, { actions: { mode: { tap_action: 'navigate' } } },
    { badges: [{ entity: 'sensor.x', hold_action: 'toggle' }] },
    { program_map: [] }, { program_map: 'eco' }, { compressor_speed_max: 0 }, { compressor_speed_max: 'fast' },
    { errors: 'sensor.error' }, { error_ok: 'No Error' }, { error_ok: ['No Error', 0] },
    { timeline: 'yes' }, { timeline_hours: 0 }, { timeline_marks: 'yes' }, { timeline_marks: [{ label: 'x' }] }, { timeline_marks: [7] }, { wall_timeout: -1 }, { wall_timeout: 'soon' }, { unit_style: 'tesla' }, { unit_size: 'huge' },
    { animations: 'sometimes' }, { flow_speed: 0 }, { flow_speed: 3.1 }, { source_spread: 'yes' }, { series_buffer: 'yes' }, { primary_pump: 'yes' }, { theme: 'sepia' }, { fullscreen: 'yes' },
    { texts: [] }, { texts: { NL: { title: 'x' } } }, { texts: { nl: { title: 7 } } }, { texts: { nl: { missing_key: 'x' } } },
    { brine_pressure_min: -0.1 }, { hc_pressure_crit: 1.2, hc_pressure_min: 1.0 }, { hc_pressure_min: 3, hc_pressure_max: 2 }]) {
    let threw = false; try { new C().setConfig(cfg); } catch (e) { threw = true; }
    check(threw, `invalid config rejected ${JSON.stringify(cfg)}`);
  }

  // 5. detection: the right preset for each installation, nothing for gas boilers or foreign entities
  check(HFC_PRESETS.heishamon.tested === true, 'HeishaMon preset is marked real-installation tested');

  // 5-00. Two integrations for one heat pump (#143): the preset with more live core entities wins, a tie keeps the order
  {
    const vaillant = setups.find((s) => s.config.preset === 'vaillant'); const ebusd = setups.find((s) => s.config.preset === 'ebusd');
    const both = hassOf(toStates({ ...vaillant.states('heat'), ...ebusd.states('heat') }), { ...(vaillant.registry || {}), ...(ebusd.registry || {}) });
    const matches = C._presetMatches(both);
    const score = (name) => matches.find((m) => m.name === name)?.score;
    check(matches.map((m) => m.name).join() === 'ebusd,vaillant' && score('ebusd') > score('vaillant'),
      `myPyllant and ebusd: both match, ebusd finds more core entities (${matches.map((m) => `${m.name} ${m.score}`).join(', ')})`);
    check(C.getStubConfig(both).preset === 'ebusd', 'the stub takes the richer match, not the first preset in the list');
    const tie = hassOf(toStates({ 'binary_sensor.vitocal_compressor': 'on', 'sensor.vitocal_refrigeration_circuit_mode': 'heating' }), {
      'binary_sensor.vitocal_compressor': { platform: 'vicare', translation_key: 'compressor' },
      'sensor.vitocal_refrigeration_circuit_mode': { platform: 'open3e', translation_key: 'refrigeration_circuit_mode' },
    });
    const tieMatches = C._presetMatches(tie);
    check(tieMatches.length === 2 && tieMatches[0].score === tieMatches[1].score && C.getStubConfig(tie).preset === 'vicare',
      `ViCare and Open3E with one core entity each: the order of the presets decides (${tieMatches.map((m) => `${m.name} ${m.score}`).join(', ')})`);
    const unavailable = hassOf(toStates({ ...vaillant.states('heat'), ...Object.fromEntries(Object.keys(ebusd.states('heat')).map((id) => [id, 'unavailable'])) }), { ...(vaillant.registry || {}), ...(ebusd.registry || {}) });
    check(C.getStubConfig(unavailable).preset === 'vaillant', 'an integration whose entities are all unavailable does not win');

    // #145: the editor marks detected presets and lists them first; zero, one and two matches
    const options = (opts) => C._formSchema({}, undefined, opts).schema.find((f) => f.name === 'preset').selector.select.options.slice(1);
    const plainOrder = Object.keys(HFC_PRESETS).join();
    let opt = options({});
    check(opt.map((o) => o.value).join() === plainOrder && !opt.some((o) => /Detected|Erkannt/.test(o.label)), 'no match: the preset list keeps its order and marks nothing');
    const ebusdOnly = hassOf(toStates(ebusd.states('heat')), ebusd.registry || {});
    opt = options({ matches: C._presetMatches(ebusdOnly) });
    check(opt[0].value === 'ebusd' && /(Detected|Erkannt) \(\d+ /.test(opt[0].label) && opt.filter((o) => /Detected|Erkannt/.test(o.label)).length === 1
      && opt.slice(1).map((o) => o.value).join() === Object.keys(HFC_PRESETS).filter((k) => k !== 'ebusd').join(), `one match: ebusd first and marked, the others in their order (${opt[0].label})`);
    opt = options({ matches });
    check(opt.slice(0, 2).map((o) => o.value).join() === 'ebusd,vaillant' && opt.slice(0, 2).every((o) => /Detected|Erkannt/.test(o.label)), 'two matches: both first, best first, both marked');
    const real = C._presetMatches; let runs = 0; C._presetMatches = (h) => { runs++; return real.call(C, h); };
    const ed = document.createElement('heatpump-flow-card-editor'); ed.setConfig({ preset: 'vaillant' }); ed.hass = both;
    ed.setConfig({ preset: 'vaillant', title: 'a' }); ed.setConfig({ preset: 'vaillant', title: 'ab' });
    const helper = ed._form?.computeHelper?.({ name: 'preset' }) || '';
    C._presetMatches = real;
    check(runs === 1, `the editor detects the presets once per registry, not on every change (${runs} runs)`);
    check(/also detected here:|ebenfalls erkannt:/i.test(helper) && helper.includes(HFC_PRESETS.ebusd.name) && !helper.includes(`${HFC_PRESETS.vaillant.name}.`), `the helper names the other detected preset (${helper.slice(-80)})`);
    ed.remove();
  }

  // 5-0. No supported integration (#142): the stub has no preset and the card shows its start state, not an error
  {
    const plain = hassOf(toStates({ 'sensor.living_room_temperature': ['21.0', '°C'], 'light.kitchen': 'on' }), {});
    const stubbed = C.getStubConfig(plain);
    check(stubbed.preset === undefined && !Object.keys(stubbed).length, `without a supported integration the stub has no preset (${JSON.stringify(stubbed)})`);
    let card = mount(stubbed, plain); await wait(20);
    const hint = card.shadowRoot.getElementById('start-hint');
    check(!!hint && !card.shadowRoot.getElementById('svg') && !card._failed && /preset/i.test(hint.textContent) && hint.querySelector('a[href*="#quick-start"]'),
      'the card without preset and entities shows the start hint with a link, no drawing and no error');
    card.hass = { ...plain }; await wait(10);
    check(!!card.shadowRoot.getElementById('start-hint') && !card._failed, 'state updates keep the start state without errors');
    card.remove();
    card = mount({ entities: { room: 'sensor.living_room_temperature' } }, plain); await wait(20);
    check(!card.shadowRoot.getElementById('start-hint') && !!card.shadowRoot.getElementById('svg'), 'one mapped entity ends the start state');
    card.remove();
    card = mount({ preset: 'lambda' }, plain); await wait(20);
    check(!card.shadowRoot.getElementById('start-hint') && /preset/i.test(card.shadowRoot.querySelector('.hint')?.textContent || ''), 'an explicit preset that finds nothing keeps its own hint');
    card.remove();
  }
  const stub = (states, registry) => C.getStubConfig(hassOf(toStates(states), registry));
  const expect = { 0: 'lambda', 1: 'lambda', 2: 'vicare', 3: 'vaillant', 4: 'emsesp', 5: 'heishamon', 6: 'emsesp', 8: 'wolf', 9: 'kronoterm', 10: 'ebusd', 11: 'samsung', 12: 'luxtronik', 15: 'stiebel_isg' };
  for (const [i, p] of Object.entries(expect)) {
    const s = setups[i]; const st = stub(s.states('heat'), s.registry || {});
    check(st.preset === p, `stub preset ${i} = ${p} (got ${st.preset})`);
    if (+i === 6) { check(st.source_type === 'brine', 'stub source_type brine'); check(st.hc_count === 2, `stub hc_count 2 (got ${st.hc_count})`); }
    if (+i === 9) check(st.hc_count === 2 && !st.source_type, `Kronoterm stub counts its two loops (${JSON.stringify(st)})`);
    // The controller also reports inactive circuits (hc3 pump "0"), so the stub must not count them.
    if (+i === 10) check(st.hc_count === undefined, `ebusd stub leaves hc_count to the user (got ${st.hc_count})`);
  }
  {
    const s = setups[10]; const hass = hassOf(toStates(s.states('heat')), s.registry);
    const r = C._resolve(s.config, hass);
    check(r.prefix === 'ebusd', `ebusd prefix detected (got ${r.prefix})`);
    check(r.entities.evap_temp === 'sensor.heating_ebusd_hmu_rundataevaporationtemp', 'ebusd: entity with device-name prefix found');
    check(r.entities.hc2_flow === 'sensor.ebusd_ctlv2_hc2flowtemp' && r.entities.hc2_pump === 'sensor.ebusd_ctlv2_hc2pumpstatus', 'ebusd: second circuit from the controller');
    check(r.entities.hc_pressure === 'sensor.ebusd_hmu_flowpressure' && r.entities.hc2_pressure === undefined, 'ebusd: one system pressure, not copied to circuit 2');
    check(r.entities.buffer_top === undefined, 'ebusd: buffer stays unmapped');
    check(r.tiles.env_energy?.total === 'sensor.ebusd_hmu_statenvironmentenergysum', 'ebusd: environmental energy tile');
    // Without the hydraulic station's hot water flag the operating state decides (#155): hwc_* is hot water, the zone valve
    // status of the controller (open/closed) is no diverter valve and stays unmapped.
    {
      const ebusd = setups.find((s) => s.config.preset === 'ebusd');
      const noFlag = (scen) => { const st = { ...ebusd.states(scen), 'sensor.ebusd_ctlv2_z1valvestatus': scen === 'heat' ? '1' : '0' }; delete st['sensor.ebusd_vwzio_statusdhw_dhwactive']; return st; };
      const reg = Object.fromEntries(Object.keys(noFlag('dhw')).map((id) => [id, { platform: 'mqtt' }]));
      const rv = C._resolve(ebusd.config, hassOf(toStates(noFlag('dhw')), reg));
      check(rv.entities.valve === undefined, `ebusd: without the hot water flag no valve is mapped, not the zone valve (${rv.entities.valve})`);
      for (const [scen, text] of [['dhw', HFC_I18N.en.valve_dhw], ['heat', HFC_I18N.en.valve_heating]]) {
        const cv = mount({ ...ebusd.config, power_sources: 'manual' }, hassOf(toStates(noFlag(scen)), reg)); await wait(20);
        check(cv.shadowRoot.getElementById('t-valve')?.textContent === text, `ebusd without hot water flag: valve follows the operating state (${scen}: ${cv.shadowRoot.getElementById('t-valve')?.textContent})`);
        cv.remove();
      }
    }
    const modes = HFC_PRESETS.ebusd.mode_map;
    check(modes.deicing_active === 'defrost' && modes.hwc_overrun === 'dhw' && modes.heat_compressor_blocked === 'blocked' && modes.standby === 'idle', 'ebusd status codes normalized');
  }
  const detects = (preset, states, registry) => HFC_PRESETS[preset].detect(C._ctx(hassOf(toStates(states), registry), undefined, { hp: 1, dhw: 1, buffer: 1, hc: 1 })) !== undefined;
  check(!detects('emsesp', { 'sensor.boiler_curflowtemp': '45', 'sensor.boiler_outdoortemp': '5' }, { 'sensor.boiler_curflowtemp': { platform: 'mqtt' } }), 'EMS-ESP gas boiler is not a heat pump');
  check(!detects('vicare', { 'sensor.vitodens_outside_temperature': '5', 'sensor.vitodens_boiler_temperature': '60' },
    { 'sensor.vitodens_outside_temperature': { platform: 'vicare', translation_key: 'outside_temperature' } }), 'ViCare gas boiler is not a heat pump');
  check(!detects('lambda', { 'sensor.other_hp1_operating_state': 'x' }, { 'sensor.other_hp1_operating_state': { platform: 'something_else' } }), 'foreign hp1_operating_state is not Lambda');
  check(!detects('samsung', { 'sensor.boiler_3_way_valve': 'Room' }, { 'sensor.boiler_3_way_valve': { platform: 'esphome' } }), 'a 3-way valve without the Samsung error code is not Samsung');
  {
    const states = {}; const registry = {};
    const add = (domain, key, state) => {
      const id = `${domain}.vitocal_${key}`;
      states[id] = state;
      registry[id] = { platform: 'open3e', translation_key: key };
      return id;
    };
    const ids = {
      mode: add('sensor', 'refrigeration_circuit_mode', 'heating'),
      compressor: add('binary_sensor', 'heat_pump_compressor_active', 'on'),
      valve: add('sensor', 'four_three_way_valve_position', 'hot_water'),
      flow: add('sensor', 'flow_temperature', '42'),
      return: add('sensor', 'return_temperature', '35'),
      dhwTop: add('sensor', 'dhw_buffer_top_temperature', '52'),
      dhwMiddle: add('sensor', 'dhw_buffer_mid_temperature', '48'),
      dhwBottom: add('sensor', 'dhw_buffer_bottom_temperature', '40'),
      circuitFlow: add('sensor', 'flow_circuit1_temperature', '38'),
      circuitTarget: add('sensor', 'flow_circuit_1_supply_temp_setpoint', '40'),
      circuitPump: add('binary_sensor', 'circuit_1_pump', 'on'),
      circuitFlow2: add('sensor', 'flow_circuit2_temperature', '32'),
      circuitTarget2: add('sensor', 'flow_circuit_2_supply_temp_setpoint', '35'),
      circuitPump2: add('binary_sensor', 'circuit_2_pump', 'on'),
      cop: add('sensor', 'cop_heating_today', '4.2'),
      dhwStatus: add('sensor', 'domestic_hot_water_status', 'active'),
    };
    const hass = hassOf(toStates(states), registry);
    const stubConfig = C.getStubConfig(hass);
    const resolved = C._resolve({ preset: 'open3e', hc_count: 2 }, hass);
    check(stubConfig.preset === 'open3e', `Open3E Vitocal preset detected (${stubConfig.preset})`);
    check(resolved.ready && resolved.entities.mode === ids.mode && resolved.entities.compressor === ids.compressor
      && resolved.entities.valve === ids.valve, 'Open3E preset maps mode, compressor and diverter valve');
    check(resolved.entities.dhw_top === ids.dhwTop && resolved.entities.dhw_middle === ids.dhwMiddle
      && resolved.entities.dhw_bottom === ids.dhwBottom, 'Open3E preset maps DHW tank temperature levels');
    check(resolved.entities.hc_flow === ids.circuitFlow && resolved.entities.hc_setpoint === ids.circuitTarget
      && resolved.entities.hc_pump === ids.circuitPump && resolved.entities.hc2_flow === ids.circuitFlow2
      && resolved.entities.hc2_setpoint === ids.circuitTarget2 && resolved.entities.hc2_pump === ids.circuitPump2
      && resolved.tiles.cop_heating.today === ids.cop, 'Open3E preset maps both circuits and daily COP entities');
    check(stubConfig.hc_count === 2, `Open3E detects two circuits (got ${stubConfig.hc_count})`);
    const card = mount({ preset: 'open3e' }, hass);
    check(/Hot water/.test(card.shadowRoot.getElementById('chip-mode')?.textContent || ''), 'Open3E hot_water valve state selects DHW mode');
    check(/Hot water/.test(card.shadowRoot.getElementById('t-dhw-mode')?.textContent || ''), 'Open3E domestic_hot_water_status "active" shows hot water charging');
    check(card._unitKey() === 'viessmann', `Open3E selects the Viessmann unit drawing (${card._unitKey()})`);
    card.remove();
  }
  check(!detects('ebusd', { 'sensor.ebusd_hmu_rundatastatuscode': 'standby' }, { 'sensor.ebusd_hmu_rundatastatuscode': { platform: 'something_else' } }), 'ebusd needs the MQTT platform');

  // Wolf (wolflink): heat pumps only, prefix = device slug; gas boilers and other platforms with the same names are not detected.
  {
    const wolfPrefix = (states, registry) => HFC_PRESETS.wolf.detect(C._ctx(hassOf(toStates(states), registry), undefined, { hp: 1, dhw: 1, buffer: 1, hc: 1 }));
    const w = setups[8].states('heat');
    check(HFC_PRESETS.wolf.tested === true, 'Wolf preset is marked real-installation tested');
    check(wolfPrefix(w, setups[8].registry) === 'zuhause', `Wolf prefix zuhause (got ${wolfPrefix(w, setups[8].registry)})`);
    const renamed = Object.fromEntries(Object.entries(w).map(([k, v]) => [k.replace('sensor.zuhause_', 'sensor.wolf_cha_07_'), v]));
    const renamedReg = Object.fromEntries(Object.keys(renamed).map((id) => [id, { platform: 'wolflink' }]));
    check(wolfPrefix(renamed, renamedReg) === 'wolf_cha_07', `Wolf prefix of another device slug (got ${wolfPrefix(renamed, renamedReg)})`);
    const gas = { 'sensor.heizung_boiler_temperature': '62', 'sensor.heizung_return_temperature': '48', 'sensor.heizung_outside_temperature': '5',
      'sensor.heizung_burner_status': 'Betrieb', 'sensor.heizung_burner': 'ein', 'sensor.heizung_3_way_valve': 'Heizung',
      'sensor.heizung_operating_mode': 'heizbetrieb', 'sensor.heizung_dhw_temperature': '50', 'sensor.heizung_system_pressure': '1.8' };
    check(!detects('wolf', gas, Object.fromEntries(Object.keys(gas).map((id) => [id, { platform: 'wolflink' }]))), 'Wolf gas boiler is not a heat pump');
    check(!detects('wolf', w, Object.fromEntries(Object.keys(w).map((id) => [id, { platform: 'mqtt' }]))), 'same entity names on another platform are not Wolf');
  }

  // PointT cloud: stable resource identities, never personal names or an EMS-ESP prefix.
  {
    const fixture = pointtSetup();
    const cfg = { preset: 'bosch_buderus_heating', power_sources: 'manual' };
    const hass = hassOf(toStates(fixture.states), fixture.registry);
    const byKey = (key, domain = 'sensor', f = fixture) => Object.keys(f.registry).find((id) =>
      id.startsWith(`${domain}.`) && f.registry[id].unique_id.endsWith(`:${key}`));
    const r = C._resolve(cfg, hass);
    check(Object.keys(C._registry(undefined)).length === 0, 'Registry context tolerates HA not being ready');
    check(r.ready && C.getStubConfig(hass).preset === cfg.preset, 'PointT is detected from the integration registry');
    check(!HFC_PRESETS.bosch_buderus_heating.tested, 'PointT preset does not claim a real installation test');
    check(r.entities.flow === byKey('gateway:supply_temperature'), 'PointT renamed flow temperature');
    check(r.entities.return === byKey('gateway:return_temperature'), 'PointT legacy return identity');
    check(r.entities.room_target === byKey('heatingCircuits:hc1:currentRoomSetpoint'), 'PointT room target remains a room target');
    check(!r.entities.hc_setpoint && !r.entities.cond_temp && !r.entities.heater, 'PointT does not mislabel room target, TC3 or auxiliary status');
    check(!r.entities.power && !r.entities.heat && !r.entities.volume, 'PointT does not invent instantaneous power or flow');
    check(!r.entities.hc_mode && !r.entities.hc_pump, 'PointT settings are not treated as pump-running signals');
    check(r.entities.starts_total === byKey('heatSources:hs1:numberOfStarts:total'), 'PointT specific compressor start counter');
    check(r.entities.starts_total !== byKey('heatSources:numberOfStarts'), 'PointT general and compressor starts stay separate');
    check(r.entities.hours !== byKey('heatSources:workingTime:totalSystem'), 'PointT system and compressor runtime stay separate');
    check(r.tiles.energy_heating.total === byKey('gateway:heating_electricity'), 'PointT heating electricity includes the auxiliary heater');
    check(r.tiles.heat_dhw.total === byKey('gateway:hot_water_heat_produced'), 'PointT DHW heat counter');
    check(r.tiles.cycles_heating.total === byKey('heatSources:hs1:numberOfStarts:ch'), 'PointT heating starts catalog source');
    check(!r.tiles.energy_cooling, 'PointT compressor-only cooling energy is not assumed to be system electricity');
    check(Object.values(r.tiles).every((periods) => Object.keys(periods).every((p) => p === 'total')), 'PointT cumulative counters are not labelled as daily readings');
    const defaults = [byKey('heatingCircuits:hc1:operationMode:control', 'select'),
      byKey('dhwCircuits:dhw1:operationMode:control', 'select'), byKey('dhwCircuits:dhw1:charge:control', 'switch')];
    check(JSON.stringify(r.controls) === JSON.stringify(defaults), 'PointT defaults contain only circuit modes and one-time DHW charge');
    check(r.details.includes(byKey('heatSources:hs1:supplyFlowCondenserTemp')), 'PointT TC3 is an additional value, not a refrigerant temperature');
    check(r.details.includes(byKey('heatSources:numberOfStarts')), 'PointT general start counter remains available in details');
    const r2 = C._resolve({ ...cfg, index: { hc: 2, dhw: 2 } }, hass);
    check(r2.entities.room_target === byKey('heatingCircuits:hc2:currentRoomSetpoint'), 'PointT selected HC2 room target');
    check(r2.entities.dhw_top === byKey('dhwCircuits:dhw2:actualTemp'), 'PointT DHW2 never falls back to DHW1');
    check(r2.controls.includes(byKey('heatingCircuits:hc2:operationMode:control', 'select')), 'PointT controls target selected HC2');
    check(!r2.controls.includes(byKey('heatingCircuits:hc1:operationMode:control', 'select')), 'PointT controls do not mix HC1 and HC2');
    const absentCircuit = C._resolve({ ...cfg, index: { hc: 3, dhw: 3 } }, hass);
    check(!absentCircuit.entities.room_target && !absentCircuit.entities.dhw_top, 'PointT absent circuit has no guessed fallback');
    check(!absentCircuit.controls.length, 'PointT absent circuits do not offer controls from another circuit');
    const multi = C._resolve({ ...cfg, hc_count: 2 }, hass);
    check(multi.entities.hc2_flow === byKey('heatingCircuits:hc2:actualSupplyTemperature'), 'PointT second hydraulic circuit flow');

    const card = mount(cfg, hass);
    check(card._controlList().length === 3 && card._drawerRows().length > 0, 'PointT short default control list and details render');
    check(!card.shadowRoot.querySelector('input[type="number"], input[type="range"]'), 'PointT default card does not expose setpoint inputs');
    check(card.shadowRoot.getElementById('t-hp-cop').textContent === '', 'PointT no live COP without instantaneous power');
    check(C._diagnosticReport(cfg, hass).includes(r.controls[0]), 'PointT diagnostic includes automatic controls');
    check(!C._diagnosticReport(cfg, hass).includes('demo-pointt:'), 'PointT diagnostic excludes gateway unique identifiers');
    let writes = 0;
    card._hass.callService = () => { writes++; return Promise.resolve(); };
    card.hass = card._hass;
    check(writes === 0, 'PointT mounting and polling never operate a control');
    card.setConfig({ ...cfg, controls: [], details: [], entities: { flow: null } });
    check(!card._controlList().length && !card._details.length && !card._e.flow, 'PointT explicit empty lists and null overrides are respected');
    card.remove();

    for (const [state, running] of [['heating', true], ['dhw', true], ['cooling', true], ['defrost', true],
      ['off', false], ['alarm', false], ['pool', false], ['pool_heat', false], ['unknown', false], ['unavailable', false]]) {
      const st = toStates(fixture.states);
      st[byKey('heatSources:compressor:status')].state = state;
      const c = mount(cfg, hassOf(st, fixture.registry));
      check(c.shadowRoot.getElementById('fan').classList.contains('on') === running, `PointT compressor state ${state}`);
      c.remove();
    }

    const other = pointtSetup('dhw', 'second-gateway', 'second_');
    const merged = hassOf(toStates({ ...fixture.states, ...other.states }), { ...fixture.registry, ...other.registry });
    check(!C._resolve(cfg, merged).ready && !Object.keys(C._resolve(cfg, merged).entities).length, 'PointT several gateways require device selection');
    const selected = C._resolve({ ...cfg, device: 'device-second-gateway' }, merged);
    check(selected.ready && Object.values(selected.entities).every((id) => id.includes('second_')), 'PointT selected gateway supplies every mapping');
    check(selected.controls.every((id) => id.includes('second_')), 'PointT selected gateway supplies every control');
    check(Object.values(selected.tiles).every((p) => p.total.includes('second_')), 'PointT selected gateway supplies every statistic');
    const writesToSelected = [];
    const selectedCard = mount({ ...cfg, device: 'device-second-gateway', index: { hc: 2 } },
      { ...merged, callService: (...args) => { writesToSelected.push(args); return Promise.resolve(); } });
    selectedCard._control(0, 'manual');
    const expectedControl = byKey('heatingCircuits:hc2:operationMode:control', 'select', other);
    check(writesToSelected.length === 1 && writesToSelected[0][0] === 'select'
      && writesToSelected[0][1] === 'select_option' && writesToSelected[0][2].entity_id === expectedControl
      && writesToSelected[0][2].option === 'manual', 'PointT simulated control targets HC2 on the selected gateway');
    const manualSetpoint = byKey('heatingCircuits:hc2:manualRoomSetpoint:control', 'number', other);
    const optionalControls = [{ entity: manualSetpoint, name: 'Selected room target' },
      byKey('system:silentMode:enabled:control', 'select', other), byKey('system:awayMode:enabled:control', 'switch', other)];
    selectedCard.setConfig({ ...cfg, device: 'device-second-gateway', index: { hc: 2 }, controls: optionalControls });
    check(selectedCard._controlList().length === 3 && selectedCard._controlList()[0].name === 'Selected room target',
      'PointT explicit optional controls replace the defaults and preserve custom labels');
    const numeric = selectedCard._controlList().findIndex((c) => c.entity === manualSetpoint);
    const numberElement = selectedCard.shadowRoot.getElementById(`ctl-${numeric}`);
    check(numberElement.min === '5' && numberElement.max === '80' && numberElement.step === '0.5', 'PointT numeric controls inherit actual bounds and step');
    selectedCard.remove();
    check(!C._resolve({ ...cfg, device: 'missing-device' }, merged).ready, 'PointT unknown device does not select another gateway');
    check(!C._resolve({ ...cfg, index: { hp: 2 } }, hass).ready, 'PointT global counters are not assigned to HP2');

    const sparse = structuredClone(fixture);
    delete sparse.states[byKey('gateway:outdoor_temperature')];
    sparse.registry[byKey('gateway:supply_temperature')].disabled_by = 'user';
    sparse.registry[defaults[0]].disabled_by = 'user';
    delete sparse.states[defaults[2]];
    const sparseResult = C._resolve(cfg, hassOf(toStates(sparse.states), sparse.registry));
    check(!sparseResult.entities.outdoor && !sparseResult.entities.flow, 'PointT ignores missing and disabled entities');
    check(JSON.stringify(sparseResult.controls) === JSON.stringify([defaults[1]]), 'PointT missing or disabled controls are omitted');
    const foreign = Object.fromEntries(Object.entries(fixture.registry).map(([id, e]) => [id, { ...e, platform: 'mqtt' }]));
    check(!C._resolve(cfg, hassOf(toStates(fixture.states), foreign)).ready, 'PointT rejects foreign integration identities');
    const gas = structuredClone(fixture);
    delete gas.registry[byKey('heatSources:compressor:status')];
    check(!C._resolve(cfg, hassOf(toStates(gas.states), gas.registry)).ready, 'PointT temperatures alone do not identify a heat pump');
    const cascade = structuredClone(fixture);
    cascade.states['sensor.second_heatpump'] = { state: 'air_water', attributes: {} };
    cascade.registry['sensor.second_heatpump'] = { platform: 'bosch_buderus_heating', unique_id: 'demo-pointt:heatSources:hs2:heatPumpType' };
    check(!C._resolve(cfg, hassOf(toStates(cascade.states), cascade.registry)).ready, 'PointT ambiguous cascade requires manual mappings');
    const duplicate = structuredClone(fixture);
    duplicate.states['sensor.duplicate_flow'] = duplicate.states[byKey('gateway:supply_temperature')];
    duplicate.registry['sensor.duplicate_flow'] = duplicate.registry[byKey('gateway:supply_temperature')];
    check(!C._resolve(cfg, hassOf(toStates(duplicate.states), duplicate.registry)).entities.flow, 'PointT ambiguous resource identity is not guessed');

    const semantic = structuredClone(fixture);
    const aliases = { 'gateway:supply_temperature': 'heatSources:actualSupplyTemperature', 'gateway:return_temperature': 'heatSources:returnTemperature',
      'gateway:total_electricity': 'heatSources:emon:totalConsumption:total_electricity', 'gateway:total_heat_produced': 'heatSources:emon:totalConsumption:outputProduced' };
    for (const [legacy, resource] of Object.entries(aliases)) semantic.registry[byKey(legacy)].unique_id = `demo-pointt:${resource}`;
    const semanticResult = C._resolve(cfg, hassOf(toStates(semantic.states), semantic.registry));
    check(semanticResult.entities.flow === r.entities.flow && semanticResult.entities.return === r.entities.return, 'PointT semantic temperature identities');
    check(semanticResult.entities.energy_total === r.entities.energy_total && semanticResult.tiles.heat.total === r.tiles.heat.total, 'PointT semantic energy identities');

    const lateStates = toStates(fixture.states);
    const lateId = byKey('gateway:outdoor_temperature'); const late = lateStates[lateId]; delete lateStates[lateId];
    const lateHass = hassOf(lateStates, fixture.registry); const lateCard = mount(cfg, lateHass);
    const lateEditor = document.createElement('heatpump-flow-card-editor'); lateEditor.setConfig(cfg); lateEditor.hass = lateHass;
    check(!lateCard._e.outdoor, 'PointT missing state is initially omitted');
    const arrived = { ...lateHass, states: { ...lateStates, [lateId]: late } };
    lateCard.hass = arrived; lateEditor.hass = arrived;
    check(lateCard._e.outdoor === lateId, 'PointT state arriving after registry is mapped without a reload');
    check(lateEditor._fromPreset.outdoor === lateId, 'PointT editor also detects late states');
    const exchangedStates = { ...lateStates, [lateId]: late }; delete exchangedStates[r.entities.flow];
    lateCard.hass = { ...lateHass, states: exchangedStates }; lateEditor.hass = { ...lateHass, states: exchangedStates };
    check(!lateCard._e.flow && lateCard._e.outdoor === lateId && !lateEditor._fromPreset.flow,
      'PointT removal refreshes both card and editor');
    lateCard.hass = lateHass; lateEditor.hass = lateHass;
    check(lateCard._e.flow === r.entities.flow && !lateCard._e.outdoor
      && lateEditor._fromPreset.flow === r.entities.flow && !lateEditor._fromPreset.outdoor,
      'PointT detects exchanged entities even when the matching state count stays the same');
    lateCard.remove(); lateEditor.remove();

    const editor = document.createElement('heatpump-flow-card-editor');
    editor.setConfig(cfg); editor.hass = hass;
    check(editor._form.data.controls.length === 3, 'PointT editor shows the short default control list');
    editor._changed({ ...editor._form.data, title: 'Renamed card' });
    check(editor._config.controls === undefined, 'PointT editor preserves automatic controls on unrelated edits');
    editor._changed({ ...editor._form.data, controls: [] });
    check(Array.isArray(editor._config.controls) && !editor._config.controls.length, 'PointT editor can hide all automatic controls');
    editor.remove();
  }

  // PointT registry loading is local, shared, bounded and isolated by HA connection.
  {
    const fixture = pointtSetup();
    const compact = Object.fromEntries(Object.entries(fixture.registry).map(([id, { unique_id, ...e }]) => [id, e]));
    const entries = Object.entries(fixture.registry).map(([entity_id, e]) => ({ entity_id, ...e }));
    const cfg = { preset: 'bosch_buderus_heating', power_sources: 'manual', tiles: [] };
    let requests = 0; let finish;
    const pending = new Promise((resolve) => { finish = resolve; });
    const hass = { ...hassOf(toStates(fixture.states), compact), connection: {}, callWS: (m) => {
      if (m.type !== 'config/entity_registry/list') return Promise.reject(new Error('Unexpected request'));
      requests++; return pending;
    } };
    check(C.getStubConfig(hass).preset === cfg.preset, 'PointT offered from compact registry before loading unique ids');
    const a = mount(cfg, hass); const b = mount(cfg, hass);
    const editor = document.createElement('heatpump-flow-card-editor'); editor.setConfig(cfg); editor.hass = hass;
    await wait(5);
    check(requests === 1 && a._needsBuild, 'PointT card and editor share one pending registry request');
    finish(entries); await wait(20);
    check(!a._needsBuild && !b._needsBuild && !!a._e.flow, 'PointT automatically rebuilds after registry arrives');
    check(editor._fromPreset.flow === a._e.flow, 'PointT editor refreshes after registry arrives');
    for (let n = 0; n < 5; n++) a.hass = { ...hass };
    await wait(5);
    check(requests === 1, 'PointT ordinary polling does not reload the registry');
    const builtCard = a.shadowRoot.querySelector('ha-card');
    a.hass = { ...hass, entities: { ...compact } }; await wait(20);
    check(requests === 2, 'PointT a compact registry change refreshes stable identities');
    check(a.shadowRoot.querySelector('ha-card') === builtCard && !!a._e.flow,
      'PointT a reloaded registry with the same entries keeps the card as it is (#164)');
    const separate = mount(cfg, { ...hass, connection: {} }); await wait(20);
    check(requests === 3, 'PointT registry cache is isolated between connections');
    a.remove(); b.remove(); editor.remove(); separate.remove();

    let deniedRequests = 0;
    const denied = { ...hass, connection: {}, callWS: () => { deniedRequests++; return Promise.reject(new Error('Unauthorized')); } };
    const manual = Object.keys(fixture.states)[1];
    const c = mount({ ...cfg, entities: { flow: manual }, controls: [] }, denied);
    await wait(20);
    for (let n = 0; n < 5; n++) c.hass = { ...denied };
    check(ok(c) && c._e.flow === manual && c._needsBuild, 'PointT denied registry access leaves manual mappings usable');
    check(deniedRequests === 1, 'PointT failed registry request does not flood HA');
    c.remove();
    const generic = mount({ power_sources: 'manual' }, denied); await wait(5);
    check(deniedRequests === 1, 'Manual cards never request the full registry'); generic.remove();
    const malformed = mount(cfg, { ...hass, connection: {}, callWS: () => Promise.resolve({ invalid: true }) });
    await wait(10);
    check(ok(malformed) && malformed._needsBuild, 'PointT malformed registry response fails without breaking the card');
    malformed.remove();
  }

  // PointT updates do not scan unrelated states, and registry changes still refresh mappings.
  {
    const fixture = pointtSetup(); const cfg = { preset: 'bosch_buderus_heating', power_sources: 'manual', tiles: [] };
    const baseStates = toStates(fixture.states);
    for (let n = 0; n < 2000; n++) baseStates[`sensor.unrelated_${n}`] = { state: '1', attributes: {} };
    let stateScans = 0; let registryScans = 0;
    const registry = new Proxy({ ...fixture.registry }, { ownKeys(target) { registryScans++; return Reflect.ownKeys(target); } });
    const hass = hassOf(baseStates, registry);
    const card = mount(cfg, hass);
    const editor = document.createElement('heatpump-flow-card-editor'); editor.setConfig(cfg); editor.hass = hass;
    await wait(20);
    const initialRegistryScans = registryScans;
    const originalControl = card.shadowRoot.getElementById('ctl-0');
    const flowId = card._e.flow;
    for (let n = 0; n < 4; n++) {
      const states = new Proxy({ ...baseStates, [flowId]: { ...baseStates[flowId], state: String(35 + n) },
        [`sensor.unrelated_new_${n}`]: { state: '1', attributes: {} } },
      { ownKeys(target) { stateScans++; return Reflect.ownKeys(target); } });
      const next = { ...hass, states };
      card.hass = next; editor.hass = next;
    }
    check(stateScans === 0 && registryScans === initialRegistryScans,
      'PointT value updates with thousands of unrelated states do not enumerate states or rescan the registry');
    check(card.shadowRoot.getElementById('ctl-0') === originalControl && card._hass.states[flowId].state === '38',
      'PointT value updates preserve existing controls while displaying the latest state');

    // HA sends a new registry object after a change to any entity; with the same PointT entities nothing is rebuilt, so styles
    // that card-mod put into the shadow root (here a marker) survive (#164)
    const marker = document.createElement('style'); marker.id = 'card-mod-marker'; card.shadowRoot.appendChild(marker);
    const sameRegistry = { ...hass, states: { ...baseStates }, entities: { ...fixture.registry, 'sensor.other_integration': { platform: 'other' } } };
    card.hass = sameRegistry; editor.hass = sameRegistry; await wait(20);
    check(card.shadowRoot.getElementById('ctl-0') === originalControl && card.shadowRoot.getElementById('card-mod-marker'),
      'a new registry object with the same PointT entities does not rebuild the card (card-mod styles survive)');

    const renamedId = 'sensor.renamed_pointt_flow';
    const renamedRegistry = { ...fixture.registry, [renamedId]: fixture.registry[flowId] }; delete renamedRegistry[flowId];
    const renamedStates = { ...baseStates, [renamedId]: baseStates[flowId] }; delete renamedStates[flowId];
    const renamed = { ...hass, entities: renamedRegistry, states: renamedStates };
    card.hass = renamed; editor.hass = renamed; await wait(20);
    check(card._e.flow === renamedId && editor._fromPreset.flow === renamedId,
      'PointT registry replacement with the same entity count refreshes renamed mappings');
    const disabled = { ...renamed, entities: { ...renamedRegistry, [renamedId]: { ...renamedRegistry[renamedId], disabled_by: 'user' } } };
    card.hass = disabled; editor.hass = disabled; await wait(20);
    check(!card._e.flow && !editor._fromPreset.flow, 'PointT registry updates remove newly disabled entities');
    card.hass = renamed; editor.hass = renamed; await wait(20);
    check(card._e.flow === renamedId && editor._fromPreset.flow === renamedId, 'PointT re-enabled entities recover without a reload');
    card.remove(); editor.remove();
  }

  // 5a. Wolf (wolf_smartset): found by translation key with any entity ids, wolflink unchanged, wolf_smartset wins when both exist,
  // Wolf's capitalised state texts (Heizbetrieb, Warmwasser, Ein, Aus, Betrieb) map like the wolflink slugs
  {
    const ws = setups.find((s) => s.name === 'Wolf CHA (wolf_smartset)'); const wl = setups.find((s) => s.name === 'Wolf CHA');
    const regAs = (reg, patch) => Object.fromEntries(Object.entries(reg).map(([id, r]) => [id, { ...r, ...patch }]));
    const without = (o, id) => Object.fromEntries(Object.entries(o).filter(([k]) => k !== id));
    const hassS = (scen) => hassOf(toStates(ws.states(scen)), ws.registry, null, ws);
    const r = C._resolve(ws.config, hassS('heat')); const e = r.entities;
    check(r.ready && r.prefix === '' && HFC_PRESETS.wolf.tested === true, `wolf_smartset detected with prefix '' and marked real-installation tested (${r.prefix} / ${r.ready})`);
    check(C.getStubConfig(hassS('heat')).preset === 'wolf', 'stub config picks the wolf preset for wolf_smartset');
    check(e.mode === 'sensor.heizgerat_betriebsart_heizgerat' && e.status === 'sensor.heizgerat_verdichterstatus' && e.compressor === 'sensor.heizgerat_verdichterfrequenz'
      && e.compressor_speed === 'sensor.heizgerat_aktuelle_leistungsvorgabe_verdichter', `wolf_smartset mode, status and compressor (${e.mode} / ${e.status} / ${e.compressor})`);
    check(e.power === 'sensor.heizgerat_leistungsaufnahme_wp_ehz' && e.heat === 'sensor.heizgerat_aktuelle_sekundarleistung' && e.flow === 'sensor.heizgerat_kesseltemperatur'
      && e.return === 'sensor.heizgerat_rucklauftemperatur' && e.volume === 'sensor.heizgerat_heizkreisdurchfluss' && e.outdoor === 'sensor.heizgerat_aussentemperatur_heizung',
      `wolf_smartset power, heat, flow, return, volume and outdoor (${e.power} / ${e.flow} / ${e.outdoor})`);
    check(e.valve === 'sensor.heizgerat_3_wege_umschaltventil_hz_ww' && e.heater === 'sensor.heizgerat_e_heizung' && e.dhw_top === 'sensor.heizgerat_warmwassertemperatur'
      && e.dhw_target === 'sensor.heizgerat_warmwassersolltemperatur', `wolf_smartset valve, heater, tank and the sensor as DHW target (${e.valve} / ${e.dhw_target})`);
    // without the sensor the number (the configured value) is the fallback
    const numId = 'number.wolf_cha_warmwassersolltemperatur_eingestellt'; const adjId = 'sensor.heizgerat_warmwassersolltemperatur';
    check(C._resolve({ preset: 'wolf' }, hassOf(toStates(without(ws.states('heat'), adjId)), without(ws.registry, adjId))).entities.dhw_target === numId,
      'wolf_smartset DHW target falls back to the number');
    check(e.hc_flow === 'sensor.bedienmodul_bm_2_0_vorlauftemperatur' && e.hc_pump === 'sensor.wolf_cha_mischerkreispumpe' && e.hc_mode === 'sensor.bedienmodul_bm_2_0_mischerkreis_status'
      && e.hc_pressure === 'sensor.heizgerat_anlagendruck' && e.room_target === 'number.bedienmodul_bm_2_0_tagtemperatur_heizung_mischerkreis_1',
      `wolf_smartset circuit: flow, system-tab pump, mode, pressure and the number as room target (${e.hc_pump} / ${e.room_target})`);
    check(e.hours === 'sensor.heizgerat_betriebsstunden_verdichter' && e.aux_hours === 'sensor.heizgerat_betriebsstunden_e_heizung' && e.buffer_top === 'sensor.heizgerat_sammlertemperatur',
      'wolf_smartset hours counters and the manual buffer line');
    check(e.room === undefined && e.program === 'sensor.bedienmodul_bm_2_0_anforderung_mischerkreis', `wolf_smartset: no room sensor, program from the mixer circuit demand (${e.room} / ${e.program})`);
    // one mixer circuit only: a second circuit maps nothing instead of repeating circuit 1 (both branches)
    const two = C._resolve({ ...ws.config, hc_count: 2 }, hassS('heat')).entities;
    const twoL = C._resolve({ ...wl.config, hc_count: 2 }, hassOf(toStates(wl.states('heat')), wl.registry)).entities;
    check(two.hc_flow && !two.hc2_flow && !two.hc2_pump && !two.hc2_mode && twoL.hc_flow && !twoL.hc2_flow && !twoL.hc2_pump && !twoL.hc2_mode,
      `hc_count 2 leaves circuit 2 empty (${two.hc2_flow} / ${twoL.hc2_flow})`);
    check(JSON.stringify(r.errors) === '[]', `wolf_smartset has no fault code, errors stay empty (${JSON.stringify(r.errors)})`);
    check(r.tiles.heat?.yesterday === 'sensor.heizgerat_erzeugte_warmemenge_vortag' && r.tiles.heat?.month === 'sensor.heizgerat_erzeugte_warmemenge_aktueller_monat'
      && r.tiles.heat_heating?.total === 'sensor.heizgerat_energiemenge_hz' && r.tiles.heat_dhw?.total === 'sensor.heizgerat_energiemenge_ww' && r.tiles.hours?.total === e.hours,
      `wolf_smartset heat counter tiles by translation key (${JSON.stringify(r.tiles)})`);
    // entity ids are irrelevant: rename every entity
    const rename = (o) => Object.fromEntries(Object.entries(o).map(([id, v]) => [id.replace('.', '.x_'), v]));
    const x = C._resolve({ preset: 'wolf' }, hassOf(toStates(rename(ws.states('heat'))), rename(ws.registry)));
    check(x.ready && x.entities.mode === 'sensor.x_heizgerat_betriebsart_heizgerat' && x.entities.room_target === 'number.x_bedienmodul_bm_2_0_tagtemperatur_heizung_mischerkreis_1',
      `wolf_smartset with arbitrary entity ids (${x.entities.mode})`);
    // "Ausgang MKP" is the pump fallback when the system-tab pump is missing (it starts disabled in the integration)
    const mkpId = 'sensor.mischermodul_mm1_ausgang_mkp'; const sysPump = 'sensor.wolf_cha_mischerkreispumpe';
    const m = C._resolve({ preset: 'wolf' }, hassOf(toStates({ ...without(ws.states('heat'), sysPump), [mkpId]: 'Ein' }),
      { ...without(ws.registry, sysPump), [mkpId]: { platform: 'wolf_smartset', translation_key: 'mkp_mixer_circuit_pump' } }));
    check(m.entities.hc_pump === mkpId, `Ausgang MKP as the pump fallback (${m.entities.hc_pump})`);
    // a boiler (no compressor status) and the same keys on another platform are not detected
    const boiler = { 'sensor.heizgerat_kesseltemperatur': ['62', '°C'], 'sensor.heizgerat_aussentemperatur_heizung': ['5', '°C'],
      'sensor.heizgerat_warmwassertemperatur': ['50', '°C'], 'sensor.heizgerat_anlagendruck': ['1.8', 'bar'] };
    check(!detects('wolf', boiler, Object.fromEntries(Object.keys(boiler).map((id) => [id, ws.registry[id]]))), 'wolf_smartset boiler without a compressor status is not a heat pump');
    check(!detects('wolf', ws.states('heat'), regAs(ws.registry, { platform: 'other' })), 'same translation keys on another platform are not Wolf');
    // both installed: wolf_smartset wins; wolflink alone is unchanged
    const both = C._resolve({ preset: 'wolf' }, hassOf(toStates({ ...wl.states('heat'), ...ws.states('heat') }), { ...wl.registry, ...ws.registry }));
    check(both.prefix === '' && both.entities.mode === 'sensor.heizgerat_betriebsart_heizgerat' && both.errors.length === 0, `wolf_smartset wins over wolflink (${both.prefix} / ${both.entities.mode})`);
    const l = C._resolve(wl.config, hassOf(toStates(wl.states('heat')), wl.registry)); const le = l.entities;
    check(l.prefix === 'zuhause' && le.mode === 'sensor.zuhause_operating_mode_heater' && le.hc_pump === 'sensor.zuhause_mkp_mixer_circuit_pump' && le.room_target === 'sensor.zuhause_day_temperature'

    o = await chip(['0', 'W']); check(!o.on, 'a setpoint of 0 shows no chip');

    const bin = await (async () => {
      const card = mount({ ...s.config, entities: { ...s.config.entities, pv_boost: 'input_boolean.heatpump_boost' } }, hass('dhw')); await wait(20);
      const on = card.shadowRoot.getElementById('chip-pv').classList.contains('on'); card.remove(); return on;
    })();
    check(bin, 'a binary entity that is on shows the chip as well');
    // timeline: heating periods split by the history of the PV entity
    const iso = (ms) => new Date(ms).toISOString();
    const mode = Object.keys(toStates(s.states('heat'))).find((k) => /eu08l_hp1_operating_state$/.test(k));
    const mock = (extra) => (h) => ({ ...h, callWS: (m) => {
      if (m.type !== 'history/history_during_period') return h.callWS(m);
      const start = Date.parse(m.start_time); const end = m.end_time ? Date.parse(m.end_time) : Date.now(); const out = {};
      m.entity_ids.forEach((id) => {
        if (id === mode) out[id] = [{ state: 'STBY', last_updated: iso(start) }, { state: 'CH', last_updated: iso(start + (end - start) / 8) }, { state: 'STBY', last_updated: iso(start + (end - start) * 7 / 8) }];
        if (id === sp) out[id] = extra(start, end);
      });

  // 18e. Kronoterm: translation keys of Cloud and Modbus, the hot water tank from the DHW thermostat, defrost over the mode

    const inlet = 'sensor.kronoterm_loop_1_inlet_temperature';
    const noInlet = C._resolve({ preset: 'kronoterm' }, hassOf(toStates(without(s.states('heat'), inlet)), without(reg, inlet)));

    // Modbus: the register-map names are found as well, and the tank sensor comes before the thermostat
    const mbList = [
      ['sensor.kt_working_function', 'working_function', 'dhw'], ['sensor.kt_hp_load', 'hp_load', ['64', '%']],

    ];
    const mbStates = toStates(Object.fromEntries(mbList.map(([id, , v]) => [id, v])));
    const mbReg = Object.fromEntries(mbList.map(([id, tk]) => [id, { platform: 'kronoterm', translation_key: tk }]));

    check(m.program === 'sensor.kt_operation_program', 'Modbus without the select: the operation program');

    const errOn = (c) => c.shadowRoot.getElementById('chip-err').classList.contains('on');

    mbStates['sensor.kt_error_warning'].state = 'alarm'; mb.hass = { ...mb._hass };
    check(errOn(mb), 'Modbus alarm shows the error chip');
    mb.remove();
    // the card: tank and room from the thermostats, circuit flows, live COP, screen reader label, diagnostic report
    const txt = (c, id) => c.shadowRoot.getElementById(id)?.textContent || '';
    const card = mount({ preset: 'kronoterm', hc_count: 2 }, hassK('heat')); await wait(20);
    check(txt(card, 't-dhw-top') === '49.6 °C' && txt(card, 't-dhw-mode') === 'Target 50 °C', `tank temperature and target from the DHW thermostat (${txt(card, 't-dhw-top')} / ${txt(card, 't-dhw-mode')})`);
    check(txt(card, 't-room') === '22.4 °C' && txt(card, 't-room-target') === 'Target 22.7 °C', `room and target (${txt(card, 't-room')} / ${txt(card, 't-room-target')})`);
    check(/^33\.2 °C/.test(txt(card, 't-hc')) && /^30\.5 °C/.test(txt(card, 't-hc2')), `circuit flows (${txt(card, 't-hc')} / ${txt(card, 't-hc2')})`);
    check(txt(card, 't-hp-cop') === 'COP 3.7' && txt(card, 't-hp-power') === '1,464 W → 5.5 kW', `live COP from heat output and power (${txt(card, 't-hp-cop')} / ${txt(card, 't-hp-power')})`);

    const st = {

      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_z1_water_temp`]: ['-78', '°C'], [`sensor.${p}_main_error`]: 'No error',

      [`sensor.${p}_main_dhw_power_consumption`]: ['0', 'W'], [`sensor.${p}_main_dhw_power_production`]: ['0', 'W'],
      'sensor.aquarea_pump_total_consumption_total': ['7690.574', 'kWh'], 'sensor.aquarea_pump_total_production_total': ['24276.876', 'kWh'],
      'sensor.aquarea_heat_power_consumed_total': ['6636.338', 'kWh'], 'sensor.aquarea_heat_power_produced_total': ['21509.845', 'kWh'],
