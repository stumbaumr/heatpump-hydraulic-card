    check(r.tiles.energy?.total === 'sensor.aquarea_pump_total_consumption_total' && r.tiles.heat?.total === 'sensor.aquarea_pump_total_production_total', 'HeishaMon totals feed the energy and heat tiles');
    check(r.tiles.energy_heating?.total === 'sensor.aquarea_heat_power_consumed_total' && r.tiles.heat_dhw?.total === 'sensor.aquarea_dhw_power_produced_total'
      && r.tiles.energy_heating?.now === `sensor.${p}_main_heat_power_consumption`, 'HeishaMon tiles per mode: now and total');
    check(!r.tiles.energy_cooling?.total, 'HeishaMon without cooling counters has no cooling total');
    check(r.entities.hc_flow === undefined, `HeishaMon ignores the zone water temperature without a zone sensor (${r.entities.hc_flow})`);
    const zone = C._resolve({ preset: 'heishamon' }, hassOf(toStates({ ...st, [`sensor.${p}_main_z1_water_temp`]: ['33', '°C'] })));
    check(zone.entities.hc_flow === `sensor.${p}_main_z1_water_temp`, 'HeishaMon keeps a valid zone water temperature');
    const card = mount({ preset: 'heishamon' }, hassOf(toStates(st))); await wait(20);
    const errOn = () => card.shadowRoot.getElementById('chip-err').classList.contains('on');
    check(!errOn(), 'HeishaMon "No error" shows no error chip');
    check(JSON.parse(card._layoutSignature()).hc === true, 'HeishaMon circuit stays drawn as a direct system');
    card.hass = hassOf(toStates({ ...st, [`sensor.${p}_main_error`]: 'H76' })); await wait(5);
    check(errOn(), 'HeishaMon error code H76 shows the error chip');
    card.remove();
  }

  // 18i. an entity list adds the values, e.g. two S0 meters of HeishaMon as the heat pump power
  {
    const p = 'panasonic_heat_pump';
    const states = {
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32.5', '°C'],
      [`sensor.${p}_main_heat_power_consumption`]: ['400', 'W'], [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'],
      [`sensor.${p}_s0_watt_1`]: ['581', 'W'], [`sensor.${p}_s0_watt_2`]: ['1.5', 'kW'],
    };
    const s0 = [`sensor.${p}_s0_watt_1`, `sensor.${p}_s0_watt_2`];
    const cfg = { preset: 'heishamon', entities: { power: s0 } };
    const r = C._resolve(cfg, hassOf(toStates(states)));
    check(r.entities.power === s0[0] && JSON.stringify(r.sums.power) === JSON.stringify(s0), `entity list: first entity stands for the key, all are summed (${r.entities.power})`);
    const single = C._resolve({ preset: 'heishamon', entities: { power: [s0[0]] } }, hassOf(toStates(states)));
    check(single.entities.power === s0[0] && !single.sums.power, 'entity list with one entity is a plain entity');
    const card = mount(cfg, hassOf(toStates(states))); await wait(20);
    check(card._w('power') === 2081, `entity list sums W and kW (${card._w('power')} W)`);
    card.hass = hassOf(toStates({ ...states, [s0[1]]: 'unavailable' })); await wait(5);
    check(card._w('power') === 581, `entity list skips a member without a number (${card._w('power')} W)`);
    card.hass = hassOf(toStates({ ...states, [s0[0]]: 'unavailable', [s0[1]]: 'unknown' })); await wait(5);
    check(Number.isNaN(card._w('power')), 'entity list without any number gives no value');
    card.remove();
    const kw = mount({ preset: 'heishamon' }, hassOf(toStates({ ...states, [`sensor.${p}_main_heat_power_production`]: ['3800', 'W'] }))); await wait(20);
    check(kw._kw('heat') === 3.8, `W to kW conversion stays exact (${kw._kw('heat')} kW)`);
    kw.remove();
    const report = C._diagnosticReport(cfg, hassOf(toStates(states)));
    check(report.includes(`- power (sum 1): ${s0[0]} = 581 W`) && report.includes(`- power (sum 2): ${s0[1]} = 1.5 kW`), 'diagnostic report lists every member of the sum');
    const flat = (list) => list.flatMap((x) => (x.schema ? flat(x.schema) : [x]));
    const find = (list) => flat(list).find((x) => x.name === 'power');
    check(find(C._formSchema(cfg).schema)?.selector?.entity?.multiple === true, 'editor shows a picker for several entities for a list');
    check(!find(C._formSchema({ preset: 'heishamon' }).schema)?.selector?.entity?.multiple, 'editor keeps the single picker without a list');
  }

  // 18f. HeishaMon: refrigerant temperatures and the superheat computed from them
  {
    const p = 'panasonic_heat_pump';
    const st = {
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32.25', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_discharge_temp`]: ['49', '°C'],
      [`sensor.${p}_main_outside_pipe_temp`]: ['1', '°C'], [`sensor.${p}_main_eva_outlet_temp`]: ['3', '°C'],
      [`sensor.${p}_main_inside_pipe_temp`]: ['32', '°C'],
    };
    const r = C._resolve({ preset: 'heishamon' }, hassOf(toStates(st)));
    check(r.entities.evap_temp === `sensor.${p}_main_outside_pipe_temp` && r.entities.suction_temp === `sensor.${p}_main_eva_outlet_temp`
      && r.entities.liquid_temp === `sensor.${p}_main_inside_pipe_temp`, 'HeishaMon refrigerant temperatures');
    const card = mount({ preset: 'heishamon' }, hassOf(toStates(st))); await wait(20);
    const rows = card._drawerRows().flatMap(([, list]) => list);
    const sh = rows.find((x) => x[0] === 'superheat');
    check(sh && sh[3]() === '2.0 K', `HeishaMon superheat from suction gas and evaporation (${sh && sh[3] ? sh[3]() : 'none'})`);
    card.remove();
    // In defrost the circuit runs backwards: the outdoor pipe is no evaporation temperature then.
    const value = (c, key) => c._drawerRows().flatMap(([, list]) => list).find((x) => x[0] === key)?.[3]();
    const defrost = mount({ preset: 'heishamon' }, hassOf(toStates({ ...st, [`switch.${p}_main_defrosting_state`]: 'on' }))); await wait(20);
    check(['evap_temp', 'suction_temp', 'liquid_temp', 'superheat'].every((k) => value(defrost, k) === '–') && /49/.test(value(defrost, 'hot_gas')),
      `HeishaMon defrost hides the heating-only refrigerant roles (${['evap_temp', 'superheat', 'hot_gas'].map((k) => value(defrost, k)).join(', ')})`);
    defrost.hass = hassOf(toStates({ ...st, [`switch.${p}_main_defrosting_state`]: 'off' })); await wait(5);
    check(value(defrost, 'superheat') === '2.0 K' && /1/.test(value(defrost, 'evap_temp')), 'after defrost the roles come back');
    defrost.remove();
    const own = mount({ preset: 'heishamon', entities: { evap_temp: `sensor.${p}_main_outside_pipe_temp` } }, hassOf(toStates({ ...st, [`switch.${p}_main_defrosting_state`]: 'on' }))); await wait(20);
    check(value(own, 'evap_temp') !== '–' && value(own, 'suction_temp') === '–', 'an entity set in the config keeps its value in defrost');
    own.remove();
  }

  // 18k. heating curve shift: target, curve and shift above the circuit pump, the flow temperature below it (HeishaMon heat request)
  {
    const p = 'panasonic_heat_pump';
    const st = (extra = {}) => toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['36.75', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_z1_water_target_temp`]: ['36', '°C'], [`sensor.${p}_main_heating_mode`]: 'compensation curve',
      [`number.${p}_main_z1_heat_request_temp`]: ['2', '°C'], [`sensor.${p}_main_z1_water_temp`]: ['-78', '°C'], ...extra,
    });
    const r = C._resolve({ preset: 'heishamon' }, hassOf(st()));
    check(r.entities.hc_curve_offset === `number.${p}_main_z1_heat_request_temp`, `HeishaMon curve shift from the heat request temperature (${r.entities.hc_curve_offset})`);
    const direct = C._resolve({ preset: 'heishamon' }, hassOf(st({ [`sensor.${p}_main_heating_mode`]: 'direct' })));
    check(direct.entities.hc_curve_offset === undefined, 'HeishaMon direct mode: the heat request temperature is the target, no curve shift');
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const zone = { [`sensor.${p}_main_z1_water_temp`]: ['36.75', '°C'] };
    const card = mount({ preset: 'heishamon', language: 'de' }, hassOf(st(zone))); await wait(20);
    const above = q(card, 't-hc'); const below = q(card, 't-hc-now');
    check(['Soll 36 °C (Kurve 34 °C + 2 K Verschiebung)', 'Soll 36 °C (Kurve 34 °C + 2 K)', 'Soll 36 °C'].includes(above?.textContent), `target, curve and shift above the pump (${above?.textContent})`);
    check(['36,8 °C', '36.8 °C'].includes(below?.textContent), `flow temperature below the pump (${below?.textContent})`);
    const pump = card.shadowRoot.querySelector('circle.pump[cx="720"]')?.getBBox() || { y: 344, height: 32 }; const ba = above.getBBox(); const bb = below.getBBox();
    check(ba.y + ba.height <= pump.y && bb.y >= pump.y + pump.height && ba.x + ba.width <= 737 && ba.x >= 399, `above ends at the pump and stays right of the valve riser, below sits under it (${ba.x.toFixed(0)}–${(ba.x + ba.width).toFixed(0)})`);
    check(above.parentNode.dataset.entity === `number.${p}_main_z1_heat_request_temp` && below.parentNode.dataset.entity === `sensor.${p}_main_z1_water_temp`
      && !card.shadowRoot.querySelector('.controls'), `read only: tap targets for the shift and the flow, no quick control (${above.parentNode.dataset.entity}, ${below.parentNode.dataset.entity})`);
    card.hass = hassOf(st({ ...zone, [`number.${p}_main_z1_heat_request_temp`]: ['-1', '°C'], [`sensor.${p}_main_z1_water_target_temp`]: ['33', '°C'] })); await wait(5);
    check(/^Soll 33 °C( \(Kurve 34 °C − 1 K( Verschiebung)?\))?$/.test(above.textContent), `negative shift (${above.textContent})`);
    card.hass = hassOf(st({ ...zone, [`number.${p}_main_z1_heat_request_temp`]: ['0', '°C'], [`sensor.${p}_main_z1_water_target_temp`]: ['34', '°C'] })); await wait(5);
    check(above.textContent === 'Soll 34 °C', `no shift: only the target (${above.textContent})`);
    card.remove();
    // Without a zone sensor the circuit has no flow of its own: the heat pump's flow stands only at the VL label.
    const own = mount({ preset: 'heishamon', language: 'de' }, hassOf(st())); await wait(20);
    check(q(own, 't-hc-now')?.textContent === '' && /^Soll 36 °C/.test(q(own, 't-hc')?.textContent), `no zone sensor: no flow temperature under the circuit (${q(own, 't-hc-now')?.textContent})`);
    own.remove();
    const en = mount({ preset: 'heishamon', language: 'en' }, hassOf(st())); await wait(20);
    check(/^Target 36 °C( \(curve 34 °C \+ 2 K( shift)?\))?$/.test(q(en, 't-hc')?.textContent), `English (${q(en, 't-hc')?.textContent})`);
    en.remove();
    // A narrow box drops the word for the shift, then the brackets.
    const fit = mount({ preset: 'heishamon', language: 'de' }, hassOf(st())); await wait(20);
    const el = q(fit, 't-hc'); el._k = ''; el.getComputedTextLength = function () { return this.textContent.length * 9; };
    fit.hass = hassOf(st({ [`number.${p}_main_z1_heat_request_temp`]: ['3', '°C'], [`sensor.${p}_main_z1_water_target_temp`]: ['37', '°C'] })); await wait(5);
    check(el.textContent === 'Soll 37 °C (Kurve 34 °C + 3 K)', `too wide: without the word for the shift (${el.textContent})`);
    fit.remove();
    const vol = mount({ entities: { flow: 'sensor.f', return: 'sensor.r', hc_flow: 'sensor.f', hc_setpoint: 'sensor.t', hc_volume: 'sensor.v', hc_curve_offset: 'sensor.shift' } },
      hassOf(toStates({ 'sensor.f': ['35', '°C'], 'sensor.r': ['30', '°C'], 'sensor.t': ['35', '°C'], 'sensor.v': ['900', 'l/h'], 'sensor.shift': ['0.5', 'K'] }))); await wait(20);
    const v = q(vol, 't-hc-vol').getBBox(); const nw = q(vol, 't-hc-now').getBBox();
    check(v.y >= nw.y + nw.height - 1 && q(vol, 't-hc-vol').textContent === '900 l/h', 'the flow rate moves below the flow temperature');
    check(/\+ 0,5 K|\+ 0\.5 K/.test(q(vol, 't-hc').textContent), `decimal shift (${q(vol, 't-hc').textContent})`);
    vol.remove();
    const none = mount({ preset: 'heishamon', entities: { hc_curve_offset: null } }, hassOf(st())); await wait(20);
    check(!q(none, 't-hc-now') && /^36,8 °C · Soll 36,0$|^36\.8 °C · Target 36\.0$/.test(q(none, 't-hc').textContent), `without the shift the label stays as before (${q(none, 't-hc').textContent})`);
    none.remove();
    const names = (config) => C._formSchema(config).schema.flatMap(function k(n) { return n.schema ? n.schema.flatMap(k) : [n.name]; });
    const lab = C._formSchema({}).computeLabel;
    check(names({ hc_count: 3 }).includes('hc_curve_offset') && names({ hc_count: 3 }).includes('hc3_curve_offset') && lab({ name: 'hc3_curve_offset' }) === lab({ name: 'hc_curve_offset' }),
      `editor offers the curve shift of each circuit (${lab({ name: 'hc_curve_offset' })})`);
    check(/- hc_curve_offset: number\.panasonic_heat_pump_main_z1_heat_request_temp = 2/.test(C._diagnosticReport({ preset: 'heishamon' }, hassOf(st()))), 'diagnostic report lists the curve shift');
  }

  // 18m. series buffer in the return: the bypass valve follows the defrost signal (or its own entity) and then stops the circuits
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['35', '°C'], 'sensor.r': ['30', '°C'], 'sensor.c': ['30', 'Hz'], 'binary_sensor.d': 'off', 'binary_sensor.b': 'off', ...extra,
    });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', defrost: 'binary_sensor.d' };
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const on = (c, id) => q(c, `p-${id}`)?.classList.contains('on');
    let card = mount({ entities: ents, series_buffer: true, language: 'de' }, hassOf(st())); await wait(20);
    check(q(card, 'sb-tank') && q(card, 'sb-arrow') && /Reihenpuffer/.test(card.shadowRoot.querySelector('.series-title')?.textContent), 'series buffer and its valve are drawn');
    check(on(card, 'byp-vl') && on(card, 'sb-vl') && on(card, 'sb-b') && !on(card, 'sb-a') && on(card, 'hc-vl') && on(card, 'byp-rl'), 'heating: circuit return through the buffer, bypass closed');
    check(q(card, 't-bypass').textContent === '' && q(card, 'sb-arrow').getAttribute('d').startsWith('M614'), 'heating: valve from B to AB');
    check(q(card, 'sb-arrow').closest('.tap').dataset.entity === 'binary_sensor.d', 'a tap on the valve opens the defrost signal');
    card.hass = hassOf(st({ 'binary_sensor.d': 'on' })); await wait(5);
    check(on(card, 'sb-a') && !on(card, 'sb-vl') && !on(card, 'sb-b') && !on(card, 'hc-vl') && on(card, 'byp-rl') && on(card, 'byp-vl'), 'defrost: flow through the bypass into the buffer, circuit stopped');
    check(q(card, 't-bypass').textContent === 'Bypass' && q(card, 'sb-arrow').getAttribute('d').startsWith('M600 481'), 'defrost: valve from A to AB');
    card.remove();
    card = mount({ entities: { ...ents, bypass_valve: 'binary_sensor.b' }, series_buffer: true }, hassOf(st({ 'binary_sensor.d': 'on' }))); await wait(20);
    check(!on(card, 'sb-a') && on(card, 'sb-b') && q(card, 'sb-arrow').closest('.tap').dataset.entity === 'binary_sensor.b', 'an own bypass valve entity wins over the defrost signal');
    card.hass = hassOf(st({ 'binary_sensor.b': 'on' })); await wait(5);
    check(on(card, 'sb-a') && !on(card, 'hc-vl'), 'bypass valve on: circuit stopped');
    card.remove();
    card = mount({ entities: { ...ents, buffer_top: 'sensor.bt' }, series_buffer: true }, hassOf(st({ 'sensor.bt': ['40', '°C'] }))); await wait(20);
    check(!q(card, 'sb-tank') && q(card, 't-buf-top'), 'a parallel buffer with its own sensors wins over the series buffer');
    card.remove();
    card = mount({ entities: ents }, hassOf(st({ 'binary_sensor.d': 'on' }))); await wait(20);
    check(!q(card, 'sb-tank') && on(card, 'hc-vl'), 'without series_buffer nothing changes, the circuit runs in defrost');
    card.remove();
    // series_bypass: false: a series buffer without a bypass valve, the circuits keep running in defrost
    card = mount({ entities: ents, series_buffer: true, series_bypass: false }, hassOf(st({ 'binary_sensor.d': 'on' }))); await wait(20);
    check(q(card, 'sb-tank') && !q(card, 'sb-arrow') && !q(card, 'p-sb-a') && !q(card, 't-bypass'), 'series_bypass: false draws the buffer without a bypass valve');
    check(on(card, 'sb-vl') && on(card, 'sb-b') && on(card, 'byp-rl') && on(card, 'hc-vl'), 'series_bypass: false: the circuit runs in defrost, its return flows through the buffer');
    card.remove();
    let bad = '';
    try { document.createElement('heatpump-flow-card').setConfig({ series_bypass: 'no' }); } catch (e) { bad = e.message; }
    check(/series_bypass must be true or false/.test(bad), 'series_bypass is checked to be a boolean');
    // More circuits: the buffer, its valve and its text keep clear of the risers and pipes of circuit 2 and up
    for (const hc_count of [2, 3]) {
      card = mount({ entities: ents, series_buffer: true, hc_count }, hassOf(st())); await wait(20);
      const box = (el) => { const b = el.getBBox(); const m = el.getCTM(); return { x: b.x + m.e, y: b.y + m.f, w: b.width, h: b.height }; };
      const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
      const own = ['sb-tank', 'sb-arrow', 't-bypass'].map((id) => q(card, id)).concat([...card.shadowRoot.querySelectorAll('.series-title, circle.valve[cx="600"]')]);
      const others = [...card.shadowRoot.querySelectorAll('[id^="p-hc-"], [id^="t-hc"], circle.pump, .radiator, .screed')].filter((el) => /[2-6]$/.test(el.id || '') || el.closest('g[transform^="translate(0 "]:not([transform="translate(0 0)"])'));
      const clashes = own.flatMap((a) => others.filter((b) => hit(box(a), box(b))).map((b) => `${a.id || a.getAttribute('class')} / ${b.id || b.getAttribute('class')}`));
      check(others.length > 0 && clashes.length === 0, `${hc_count} circuits: the series buffer keeps clear of the other circuits (${clashes.join(', ') || others.length + ' parts checked'})`);
      check(on(card, 'sb-b') && on(card, 'hc-vl2'), `${hc_count} circuits: the return of all circuits flows through the series buffer`);
      card.remove();
    }
    const keys = C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; });
    check(keys.includes('series_buffer') && keys.includes('bypass_valve'), 'editor offers the series buffer and its bypass valve');
    const keysWith = C._formSchema({ series_buffer: true }).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; });
    check(!keys.includes('series_bypass') && keysWith.includes('series_bypass'), 'editor offers series_bypass only with a series buffer');
  }

  // 18n. fan speed: the fan follows its own speed entity (it runs on after the compressor stops), else the running state
  {
    const p = 'panasonic_heat_pump';
    const st = (extra = {}) => toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['34', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_fan1_motor_speed`]: ['700', 'R/min'], ...extra,
    });
    const r = C._resolve({ preset: 'heishamon' }, hassOf(st()));
    check(r.entities.fan_speed === `sensor.${p}_main_fan1_motor_speed`, `HeishaMon fan speed from fan 1 (${r.entities.fan_speed})`);
    const fan = (c) => c.shadowRoot.getElementById('fan');
    let card = mount({ preset: 'heishamon' }, hassOf(st())); await wait(20);
    check(fan(card).classList.contains('on') && card._speedDurs.fan > 0, 'the fan runs on after the compressor stops');
    card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: ['0', 'R/min'], [`sensor.${p}_main_compressor_freq`]: ['30', 'Hz'] })); await wait(5);
    check(!fan(card).classList.contains('on'), 'a fan speed of 0 stops the fan, also with the compressor running');
    card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: ['900', 'R/min'] })); await wait(5);
    const fast = card._speedDurs.fan;
    card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: ['300', 'R/min'] })); await wait(5);
    check(fast < card._speedDurs.fan, 'a higher fan speed turns the fan faster');
    for (const state of ['unavailable', 'unknown']) {
      card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: state, [`sensor.${p}_main_compressor_freq`]: ['30', 'Hz'] })); await wait(5);
      check(fan(card).classList.contains('on'), `a fan speed entity that is ${state} falls back to the running state (compressor on)`);
      card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: state, [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] })); await wait(5);
      check(!fan(card).classList.contains('on'), `a fan speed entity that is ${state} falls back to the running state (compressor off)`);
    }
    card.remove();
    card = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.c', fan_speed: 'binary_sensor.fan' } },
      hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.c': 'off', 'binary_sensor.fan': 'on' }))); await wait(20);
    check(fan(card).classList.contains('on'), 'a binary fan entity turns the fan');
    card.remove();
    card = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.c' } }, hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.c': 'on' }))); await wait(20);
    check(fan(card).classList.contains('on'), 'without a fan entity the fan follows the running state');
    card.remove();
    check(C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; }).includes('fan_speed'), 'editor offers the fan speed');
  }

  // 18l. primary pump inside the heat pump (primary_pump): drawn on the flow pipe under the flow temperature and over the flow rate, the single direct circuit has none
  {
    const p = 'panasonic_heat_pump';
    const st = (extra = {}) => toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_pump_flow`]: ['10.9', 'l/min'], [`sensor.${p}_main_z1_water_temp`]: ['-78', '°C'], ...extra,
    });
    const q = (c, sel) => c.shadowRoot.querySelector(sel);
    let card = mount({ preset: 'heishamon' }, hassOf(st())); await wait(20);
    check(q(card, '#impeller-primary'), 'HeishaMon: the card draws the primary pump of the heat pump');
    const box = q(card, '#hp-box').getBBox(); const pump = q(card, '#impeller-primary').parentNode.querySelector('circle.pump').getBBox();
    const apart = (a, b) => a.x + a.width <= b.x || b.x + b.width <= a.x || a.y + a.height <= b.y || b.y + b.height <= a.y;
    check(pump.x >= box.x + box.width && pump.x + pump.width <= 402 && pump.y < 250 && pump.y + pump.height > 250, 'the primary pump sits on the flow pipe between the heat pump block and the valve');
    const mid = (r) => r.x + r.width / 2;
    check(Math.abs(mid(pump) - mid(q(card, '#t-vl').getBBox())) < 1 && Math.abs(mid(pump) - mid(q(card, '#t-vol').getBBox())) < 1, 'the primary pump stands centred under the flow temperature and over the flow rate');
    check(apart(pump, q(card, '#t-vl').getBBox()) && apart(pump, q(card, '#t-vol').getBBox()), `the primary pump keeps clear of the flow temperature and the flow rate (${[pump, q(card, '#t-vl').getBBox(), q(card, '#t-vol').getBBox()].map((r) => [r.x, r.y, r.width, r.height].map(Math.round).join(',')).join(' / ')})`);
    check(q(card, '#impeller-primary').parentNode.querySelector('circle.pump').getAttribute('r') === '16', 'the primary pump has the size of the circuit pump (r 16)');
    check(!q(card, 'circle.pump[cx="720"]') && !q(card, '#impeller'), 'the single direct circuit has no pump of its own');
    check(q(card, '#impeller-primary').classList.contains('on'), 'the primary pump turns with a flow rate');
    check(q(card, '#impeller-primary').closest('.tap').dataset.entity === `sensor.${p}_main_pump_flow`, 'a tap on the primary pump opens the flow rate');
    card.remove();
    card = mount({ preset: 'heishamon' }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['0', 'l/min'], [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] }))); await wait(20);
    check(!q(card, '#impeller-primary').classList.contains('on'), 'the primary pump stands still without a flow rate');
    card.remove();
    // Sniffing: the compressor is off, the primary pump moves a few l/h. The water circulates slowly, the mode stays idle.
    card = mount({ preset: 'heishamon', hc_type: 'radiator' }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['0.13', 'l/min'], [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] }))); await wait(20);
    const imp = q(card, '#impeller-primary');
    check(imp.classList.contains('on') && card._speedDurs.primary >= 29, `sniffing: the primary pump turns slowly (${card._speedDurs.primary}s)`);
    check(q(card, '#p-vl').classList.contains('on') && q(card, '#p-rl').classList.contains('on') && q(card, '#p-hc-vl').classList.contains('on'), 'sniffing: the water circulates through the heating circuit');
    check(q(card, '#t-vol').textContent === '8 l/h' && card._speedDurs.flow >= 29, `sniffing: slow flow with its flow rate (${q(card, '#t-vol').textContent})`);
    check(!q(card, '#chip-mode').className.includes('mode-heat'), 'sniffing: the mode stays idle');
    check(!q(card, '#waves').classList.contains('on'), 'sniffing: the emitter gives off no heat');
    card.remove();
    card = mount({ preset: 'heishamon', hc_type: 'radiator' }, hassOf(st())); await wait(20);
    check(card._speedDurs.primary < 2, `heating: the primary pump turns at normal speed (${card._speedDurs.primary}s)`);
    check(q(card, '#waves').classList.contains('on'), 'heating: the emitter gives off heat');
    card.remove();
    // The flow dashes follow the pump: double the flow rate, half the cycle time.
    const durAt = async (lmin) => {
      card = mount({ preset: 'heishamon' }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: [lmin, 'l/min'] }))); await wait(20);
      const d = +card._speedDurs.flow.toFixed(2); card.remove(); return d;
    };
    const d10 = await durAt('10'), d20 = await durAt('20');
    check(Math.abs(d10 / d20 - 2) < 0.05 && d10 < 2, `the flow speed is proportional to the flow rate (10 l/min ${d10}s, 20 l/min ${d20}s)`);
    card = mount({ preset: 'heishamon', primary_pump: false }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['0.13', 'l/min'], [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] }))); await wait(20);
    check(!q(card, '#p-vl').classList.contains('on'), 'without the primary pump a flow rate alone does not start the flow');
    card.remove();
    card = mount({ preset: 'heishamon', primary_pump: false }, hassOf(st())); await wait(20);
    check(!q(card, '#impeller-primary') && q(card, 'circle.pump[cx="720"]'), 'primary_pump: false draws the pump in the circuit again');
    card.remove();
    card = mount({ preset: 'heishamon', entities: { hc_pump: 'binary_sensor.z1_pump' } }, hassOf({ ...st(), 'binary_sensor.z1_pump': { state: 'on', attributes: {} } })); await wait(20);
    check(q(card, '#impeller-primary') && q(card, 'circle.pump[cx="720"]'), 'a circuit pump sensor keeps the circuit pump next to the primary pump');
    card.remove();
    card = mount({ ...setups[0].config }, hassOf(toStates(setups[0].states('heat')), setups[0].registry || {}, setups[0].energy, setups[0])); await wait(20);
    check(!q(card, '#impeller-primary'), 'presets without primary_pump keep the circuit pump only');
    card.remove();
    check(C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; }).includes('primary_pump'), 'editor offers the primary pump in the heat pump');
  }

  // 18o. primary pump of the Samsung and Kronoterm presets: the pump of the heat pump stands on the flow pipe
  {
    const mountSetup = async (name, scenario = 'heat', extra = {}) => {
      const s = setups.find((x) => x.name === name);
      const c = mount({ ...s.config, ...extra }, hassOf(toStates(s.states(scenario)), s.registry || {}, s.energy, s)); await wait(20);
      return c;
    };
    const q = (c, sel) => c.shadowRoot.querySelector(sel);
    for (const name of ['Samsung EHS', 'Kronoterm ADAPT']) {
      let card = await mountSetup(name);
      check(ok(card) && !!q(card, '#impeller-primary'), `${name}: the preset draws the primary pump of the heat pump`);
      check(q(card, '#impeller-primary').classList.contains('on'), `${name}: the primary pump turns while heating`);
      const box = q(card, '#hp-box').getBBox(); const pump = q(card, '#impeller-primary').parentNode.querySelector('circle.pump').getBBox();
      check(pump.x >= box.x + box.width && pump.x + pump.width <= 402 && pump.y < 250 && pump.y + pump.height > 250, `${name}: the pump sits on the flow pipe between the heat pump block and the valve`);
      card.remove();
      card = await mountSetup(name, 'dhw');
      check(q(card, '#impeller-primary').classList.contains('on'), `${name}: the primary pump turns for hot water, too`);
      card.remove();
      card = await mountSetup(name, 'idle');
      check(!q(card, '#impeller-primary').classList.contains('on'), `${name}: the primary pump stands still in standby`);
      card.remove();
      card = await mountSetup(name, 'heat', { primary_pump: false });
      check(!q(card, '#impeller-primary') && !!q(card, 'circle.pump[cx="720"]'), `${name}: primary_pump: false draws the pump in the circuit again`);
      card.remove();
    }
    let card = await mountSetup('Samsung EHS');
    check(!q(card, 'circle.pump[cx="720"]'), 'Samsung: the single direct circuit has no pump of its own');
    card.remove();
    card = await mountSetup('Kronoterm ADAPT');
    check(!!q(card, 'circle.pump[cx="720"]'), 'Kronoterm: the loop pump stays in the circuit next to the primary pump');
    card.remove();
    check(Object.entries(HFC_PRESETS).filter(([, p]) => p.primary_pump).map(([k]) => k).sort().join() === 'heishamon,kronoterm,samsung', 'presets with a primary pump: HeishaMon, Kronoterm, Samsung');
  }

  // 18p. hot-water standby loss (#32): cool-down in K/h only in verified standby windows, charging and draw-off excluded
  {
    const H = 3600000; const end = Date.now(); const start = end - 48 * H;
    // Temperature points every 12 minutes from `from` to `to` hours ago, falling by `rate` K/h (0.1 K resolution).
    const cool = (from, to, t0, rate) => { const out = []; for (let h = from; h >= to - 1e-9; h -= 0.2) out.push([h, (t0 - rate * (from - h)).toFixed(1)]); return out; };
    const hist = (spec) => Object.fromEntries(Object.entries(spec).map(([id, pts]) => [id, pts.map(([h, s]) => ({ t: end - h * H, s: String(s) }))]));
    const ids = { temps: ['sensor.top', 'sensor.bottom'], run: { comp: 'binary_sensor.comp', valve: 'binary_sensor.valve' }, extra: ['switch.rod'] };
    const base = {
      'binary_sensor.comp': [[48, 'on'], [46, 'off']], 'binary_sensor.valve': [[48, 'on'], [46, 'off']], 'switch.rod': [[48, 'off']],
      'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 0, 52, 0.4)], 'sensor.bottom': [...cool(48, 46.2, 40, -5), ...cool(46, 0, 50, 0.3)],
    };
    const card = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.comp', valve: 'binary_sensor.valve', dhw_top: 'sensor.top' } },
      hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.comp': 'off', 'binary_sensor.valve': 'off', 'sensor.top': ['40', '°C'] }))); await wait(20);
    const loss = (spec) => card._dhwLoss(hist({ ...base, ...spec }), ids, start, end);
    const near = (r, v) => r && Math.abs(r.rate - v) < 0.03;
    let r = loss({});
    // The window starts after the charge, its settling time and the last rise of the charge (about 45.3 of 48 hours).
    check(near(r, 0.4) && r.windows === 1 && r.hours > 45 && r.hours <= 45.5, `clean standby after a charge: 0.4 K/h over about 45 h (${JSON.stringify(r)})`);
    // Draw-off: the top sensor drops 2 K, the bottom 12 K; the drop itself must not count as loss.
    r = loss({ 'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 20.2, 52, 0.4), ...cool(20, 0, 52 - 0.4 * 26 - 2, 0.4)],
      'sensor.bottom': [...cool(48, 46.2, 40, -5), ...cool(46, 20.2, 50, 0.3), ...cool(20, 0, 50 - 0.3 * 26 - 12, 0.3)] });
    check(near(r, 0.4) && r.windows === 2, `draw-off is cut out of the standby window (${JSON.stringify(r)})`);
    // Small draw-off seen only at the bottom sensor (cold water enters at the bottom).
    r = loss({ 'sensor.bottom': [...cool(48, 46.2, 40, -5), ...cool(46, 30.2, 50, 0.3), ...cool(30, 0, 50 - 0.3 * 16 - 6, 0.3)] });
    check(r && r.windows === 2, `a draw-off seen only at the bottom sensor splits the window (${JSON.stringify(r)})`);
    // A hot-water charge in between: compressor on with the valve on hot water, the tank warms up.
    r = loss({ 'binary_sensor.comp': [[48, 'on'], [46, 'off'], [24, 'on'], [23, 'off']], 'binary_sensor.valve': [[48, 'on'], [46, 'off'], [24, 'on'], [23, 'off']],
      'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 24.2, 52, 0.4), ...cool(24, 23.2, 43.2, -9), ...cool(23, 0, 52, 0.4)] });
    check(near(r, 0.4) && r.windows === 2, `a hot-water charge is excluded (${JSON.stringify(r)})`);
    // The heater rod heats the tank without the heat pump.
    r = loss({ 'switch.rod': [[48, 'off'], [30, 'on'], [29, 'off']], 'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 30.2, 52, 0.4), ...cool(30, 29.2, 45.6, -6), ...cool(29, 0, 51, 0.4)] });
    check(near(r, 0.4) && r.windows === 2, `heater rod operation is excluded (${JSON.stringify(r)})`);
    // A rise the card cannot explain (no charging signal) is excluded as well.
    r = loss({ 'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 25.2, 52, 0.4), [25, '46.0'], ...cool(24.8, 0, 47.6, 0.4)] });
    check(near(r, 0.4) && r.windows === 2, `an unexplained temperature rise is excluded (${JSON.stringify(r)})`);
    // An unavailable sensor leaves a gap.
    r = loss({ 'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 10.2, 52, 0.4), [10, 'unavailable'], ...cool(9, 0, 52 - 0.4 * 37, 0.4)] });
    check(near(r, 0.4) && r.windows === 2, `an unavailable tank sensor is excluded (${JSON.stringify(r)})`);
    // Charges every 2.5 hours leave no window of three hours: no value instead of a guess.
    const often = []; for (let h = 48; h > 0; h -= 2.5) often.push([h, 'on'], [h - 0.3, 'off']);
    r = loss({ 'binary_sensor.comp': often, 'binary_sensor.valve': often });
    check(r === null, `without a standby window of three hours there is no value (${JSON.stringify(r)})`);
    // History that starts late: the time before the first state is unknown.
    r = loss({ 'binary_sensor.comp': [[10, 'off']], 'binary_sensor.valve': [[10, 'off']] });
    check(r && Math.abs(r.hours - 10) < 0.01, `time before the first known state is not used (${JSON.stringify(r)})`);
    // A draw-off within 30 minutes of the first sample: 50 to 45 degrees after 20 minutes, then constant. It must not count as loss.
    r = loss({ 'sensor.top': [[48, '50.0'], [47.67, '45.0'], [24, '45.0']], 'sensor.bottom': [[48, '40.0'], [47.67, '40.0']] });
    check(r === null || r.rate < 0.03, `a draw-off right at the start of the history is not a loss (${JSON.stringify(r)})`);
    // Unknown running signals: the compressor on while the valve is unavailable could be a hot-water run.
    r = loss({ 'binary_sensor.comp': [[48, 'on'], [46, 'off'], [30, 'on'], [29, 'off']], 'binary_sensor.valve': [[48, 'on'], [46, 'off'], [30, 'unavailable'], [29, 'off']] });
    check(near(r, 0.4) && r.windows === 2, `an unavailable valve while the compressor runs is excluded (${JSON.stringify(r)})`);
    // The compressor has no history at all, the valve has: nothing can be verified.
    r = loss({ 'binary_sensor.comp': [] });
    check(r === null, `a running signal without history gives no value (${JSON.stringify(r)})`);
    card.remove();
    // A thermostat as the tank sensor keeps its temperature in an attribute, so the tile is not offered for it.
    const thermo = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.comp', valve: 'binary_sensor.valve', dhw_top: 'climate.tank' } },
      hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.comp': 'off', 'binary_sensor.valve': 'off', 'climate.tank': { state: 'heat', attributes: { current_temperature: 48 } } }))); await wait(20);
    check(!thermo._tilePeriods('dhw_loss').length, 'a thermostat as the top tank sensor: the loss tile is not offered');
    thermo.remove();
    const mixed = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.comp', valve: 'binary_sensor.valve', dhw_top: 'sensor.top', dhw_bottom: 'climate.tank' } },
      hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.comp': 'off', 'binary_sensor.valve': 'off', 'sensor.top': ['40', '°C'], 'climate.tank': { state: 'heat', attributes: { current_temperature: 38 } } }))); await wait(20);
    check(mixed._tilePeriods('dhw_loss').join() === 'now' && mixed._lossIds().temps.join() === 'sensor.top', 'a thermostat below a plain top sensor is left out of the measurement');
    mixed.remove();
    // Tile: needs a tank sensor and a running signal; reads the history and shows K/h.
    const st = toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.comp': 'off', 'binary_sensor.valve': 'off', 'sensor.top': ['33.6', '°C'] });
    const setup = { states: () => ({}), history: Object.fromEntries(Object.entries(base).filter(([id]) => id !== 'switch.rod' && id !== 'sensor.bottom')) };
    const tile = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.comp', valve: 'binary_sensor.valve', dhw_top: 'sensor.top' }, tiles: ['dhw_loss'] }, hassOf(st, {}, undefined, setup));
    await wait(60);
    const stats = tile.shadowRoot.getElementById('stats').textContent;
    check(/DHW standby loss/.test(stats) && /0\.4\d K\/h/.test(stats), `the tile shows the standby loss (${stats.trim()})`);
    check(tile._tilePeriods('dhw_loss').join() === 'now' && tile._tileEntity(tile._tileSource('dhw_loss', 'now')) === 'sensor.top', 'the tile opens the tank sensor');
    tile.remove();
    const none = mount({ entities: { flow: 'sensor.f', dhw_top: 'sensor.top' } }, hassOf(st)); await wait(20);
    check(!none._tilePeriods('dhw_loss').length, 'without an operating mode or compressor the loss tile is not offered');
    none.remove();
  }

  // 18q. one water loop without a parallel buffer (#124): circuits and heat pump flow together, the diverter valve closes the heating side
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['35', '°C'], 'sensor.r': ['30', '°C'], 'sensor.c': ['0', 'Hz'], 'binary_sensor.p': 'on', 'binary_sensor.p2': 'off',
      'sensor.v': ['0', 'l/h'], 'binary_sensor.valve': 'off', 'sensor.top': ['48', '°C'], 'sensor.bt': ['33', '°C'], ...extra,
    });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', volume: 'sensor.v', hc_pump: 'binary_sensor.p' };
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const on = (c, id) => !!q(c, id)?.classList.contains('on');
    // A circuit pump alone moves the water through the heat pump, but brings no heat to the emitter.
    let card = mount({ entities: ents, hc_type: 'radiator' }, hassOf(st())); await wait(20);
    check(['p-hc-vl', 'p-hc-rl', 'p-byp-vl', 'p-byp-rl', 'p-vl', 'p-rl'].every((id) => on(card, id)) && on(card, 'impeller'), 'direct: a running circuit pump moves the water through the heat pump');
    check(!on(card, 'waves') && q(card, 't-vol').textContent === '', 'direct: the circuit pump alone brings no heat and shows no flow rate of the heat pump');
    card.hass = hassOf(st({ 'binary_sensor.p': 'off' })); await wait(5);
    check(!on(card, 'p-hc-vl') && !on(card, 'p-vl'), 'direct: everything stands still without a pump');
    card.remove();
    // Charging the tank: the diverter valve closes the heating side, the running circuit pump moves no water.
    card = mount({ entities: { ...ents, valve: 'binary_sensor.valve', dhw_top: 'sensor.top' } }, hassOf(st({ 'sensor.c': ['40', 'Hz'], 'binary_sensor.valve': 'on' }))); await wait(20);
    check(on(card, 'p-vl-dhw') && !on(card, 'p-vl-buf') && !on(card, 'p-byp-vl') && !on(card, 'p-hc-vl'), 'direct, hot water: the heating side stays closed');
    check(on(card, 'impeller'), 'direct, hot water: the circuit pump still turns');
    card.remove();
    // Primary pump circulates, circuit pumps off: the water passes the circuits, their pumps stand still.
    card = mount({ entities: ents, primary_pump: true }, hassOf(st({ 'binary_sensor.p': 'off', 'sensor.v': ['120', 'l/h'] }))); await wait(20);
    check(on(card, 'p-byp-vl') && on(card, 'p-hc-vl') && on(card, 'p-hc-rl') && !on(card, 'impeller'), 'direct, primary pump: the water passes the circuit with its pump standing still');
    card.remove();
    // Several circuits: a circuit with its pump off stays still while another one runs.
    card = mount({ entities: { ...ents, hc2_pump: 'binary_sensor.p2' }, hc_count: 2 }, hassOf(st({ 'sensor.c': ['40', 'Hz'] }))); await wait(20);
    check(on(card, 'p-hc-vl') && !on(card, 'p-hc-up2') && !on(card, 'p-hc-body2'), 'direct, two circuits: the stopped circuit stays still while the other one runs');
    card.remove();
    // Series buffer: the pumped water also runs through the buffer.
    card = mount({ entities: ents, series_buffer: true }, hassOf(st())); await wait(20);
    check(on(card, 'p-sb-vl') && on(card, 'p-sb-b') && on(card, 'p-vl'), 'series buffer: a running circuit pump moves the water through buffer and heat pump');
    card.remove();
    // A parallel buffer decouples the loops: the circuit runs from the buffer, the heat pump side stands still.
    card = mount({ entities: { ...ents, buffer_top: 'sensor.bt' }, hc_type: 'radiator' }, hassOf(st())); await wait(20);
    check(on(card, 'p-hc-vl') && !on(card, 'p-vl') && !on(card, 'p-vl-buf') && on(card, 'waves'), 'parallel buffer: the circuit runs from the buffer alone');
    card.remove();
  }

  // 18r. combined storage (storage: combined, #50): one tank, hot-water zone on top, the six storage keys as heights
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['40', 'Hz'], 'binary_sensor.valve': 'off', 'binary_sensor.p': 'on',
      'sensor.t1': ['52', '°C'], 'sensor.t2': ['47', '°C'], 'sensor.t3': ['42', '°C'], 'sensor.t4': ['35', '°C'], 'sensor.t5': ['30', '°C'], 'binary_sensor.bh': 'on', ...extra,
    });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', valve: 'binary_sensor.valve', hc_pump: 'binary_sensor.p',
      dhw_top: 'sensor.t1', dhw_middle: 'sensor.t2', dhw_bottom: 'sensor.t3', buffer_top: 'sensor.t4', buffer_bottom: 'sensor.t5', buffer_heater: 'binary_sensor.bh' };
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const on = (c, id) => !!q(c, id)?.classList.contains('on');
    let card = mount({ entities: ents, storage: 'combined', hc_count: 2, language: 'de' }, hassOf(st())); await wait(20);
    const tanks = [...card.shadowRoot.querySelectorAll('rect.tank')];
    check(tanks.length === 1 && q(card, 'cs-tank')?.getAttribute('height') === '480', `one tall tank instead of two (${tanks.length} tanks)`);
    const titles = [...card.shadowRoot.querySelectorAll('.tank-title, .zone-title')].map((t) => t.textContent);
    check(titles.includes('Kombispeicher') && titles.includes('Warmwasser') && titles.includes('Heizung') && !titles.includes('Puffer'), `title and zone titles (${titles.join(', ')})`);
    const stops = [...card.shadowRoot.querySelectorAll('#g-cs stop')];
    const offsets = stops.map((s) => parseFloat(s.getAttribute('offset')));
    check(stops.length === 5 && offsets.every((o, n) => !n || o > offsets[n - 1]) && stops.every((s) => /color-mix/.test(s.getAttribute('stop-color'))), `one gradient over the five sensors, top to bottom (${offsets.join(', ')})`);
    check(q(card, 't-dhw-top').textContent.startsWith('52') && q(card, 't-buf-top').textContent.startsWith('35') && /30/.test(q(card, 't-buf-bottom').textContent), 'the sensors stand at their heights in the one tank');
    const bh = q(card, 'heater-buf').getBBox();
    check(bh.y > 280 && bh.y + bh.height < 520 && q(card, 'heater-buf').classList.contains('on'), 'the buffer heater rod sits in the heating zone');
    check(on(card, 'p-vl-buf') && !on(card, 'p-vl-dhw') && on(card, 'p-hc-vl') && on(card, 'p-hc-up2'), 'heating: the heat pump charges the heating zone, the circuits draw from it');
    card.hass = hassOf(st({ 'binary_sensor.valve': 'on' })); await wait(5);
    check(on(card, 'p-vl-dhw') && on(card, 'p-rl-dhw') && !on(card, 'p-vl-buf') && on(card, 'coil') && on(card, 'p-hc-vl'), 'hot water: the valve charges the top zone, the circuits keep drawing from the heating zone');
    card.hass = hassOf(st({ 'sensor.c': ['0', 'Hz'] })); await wait(5);
    check(on(card, 'p-hc-vl') && !on(card, 'p-vl') && !on(card, 'p-vl-buf'), 'standby: the circuits run from the tank, the heat pump side stands still');
    check(!q(card, 'p-byp-vl') && !q(card, 'sb-tank'), 'no bypass and no series buffer next to the combined storage');
    card.remove();
    // Without sensors the tank is still drawn, grey and without values.
    card = mount({ entities: { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c' }, storage: 'combined' }, hassOf(st())); await wait(20);
    check(q(card, 'cs-tank') && q(card, 't-buf-top').textContent === '' && q(card, 't-dhw-top').textContent === '' && card.shadowRoot.querySelectorAll('#g-cs stop').length === 1, 'without sensors the combined storage is drawn without values');
    card.remove();
    // Solar thermal enters the hot-water zone.
    card = mount({ entities: { ...ents, solar_collector: 'sensor.t1' }, storage: 'combined' }, hassOf(st())); await wait(20);
    check(!!q(card, 'p-sol') && !!q(card, 'solar'), 'solar thermal feeds the hot-water zone of the combined storage');
    card.remove();
    // Configuration rules and editor.
    const err = (config) => { try { document.createElement('heatpump-flow-card').setConfig(config); return ''; } catch (e) { return e.message; } };
    check(/storage must be one of: separate, combined/.test(err({ storage: 'layered' })), 'storage accepts separate or combined');
    check(/cannot be used with series_buffer/.test(err({ storage: 'combined', series_buffer: true })), 'combined storage with a series buffer is rejected');
    check(err({ storage: 'separate' }) === '', 'storage: separate is accepted');
    const keysOf = (n) => (n.schema ? n.schema.flatMap(keysOf) : [n.name]);
    const keys = C._formSchema({}).schema.flatMap(keysOf); const keysCs = C._formSchema({ storage: 'combined', series_buffer: true }).schema.flatMap(keysOf);
    check(keys.includes('storage') && keys.includes('series_buffer') && !keysCs.includes('series_buffer') && !keysCs.includes('series_bypass'), 'editor offers storage and hides the series buffer for a combined storage');
    const sel = C._formSchema({}).schema.flatMap(function all(n) { return n.schema ? n.schema.flatMap(all) : [n]; }).find((n) => n.name === 'storage');
    check(sel.selector.select.options.map((o) => o.value).join() === 'separate,combined', 'the storage field offers separate and combined');
  }

  // 18s. hot-water preparation (dhw_type): coil, fresh-water station on the combined storage or the buffer, tank in tank
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['40', 'Hz'], 'binary_sensor.valve': 'off', 'binary_sensor.p': 'on',
      'sensor.t1': ['52', '°C'], 'sensor.t3': ['42', '°C'], 'sensor.t4': ['48', '°C'], 'sensor.t5': ['30', '°C'], 'sensor.mode': 'Heating', ...extra,
    });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', valve: 'binary_sensor.valve', hc_pump: 'binary_sensor.p',
      dhw_top: 'sensor.t1', dhw_bottom: 'sensor.t3', buffer_top: 'sensor.t4', buffer_bottom: 'sensor.t5' };
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const on = (c, id) => !!q(c, id)?.classList.contains('on');
    // Combined storage: the coil is the default, the other types replace it.
    let card = mount({ entities: ents, storage: 'combined' }, hassOf(st())); await wait(20);
    check(q(card, 'coil') && !q(card, 'fws') && !q(card, 'inner-tank'), 'combined storage: the coil is the default');
    card.remove();
    card = mount({ entities: ents, storage: 'combined', dhw_type: 'tank_in_tank' }, hassOf(st())); await wait(20);
    const inner = q(card, 'inner-tank')?.getBBox();
    check(!q(card, 'coil') && inner && inner.y > 40 && inner.y + inner.height < 280, 'combined storage, tank in tank: an inner tank in the hot-water zone, no coil');
    card.remove();
    card = mount({ entities: ents, storage: 'combined', dhw_type: 'fresh_water' }, hassOf(st({ 'binary_sensor.valve': 'on' }))); await wait(20);
    const fws = q(card, 'fws')?.getBBox();
    check(!q(card, 'coil') && fws && fws.x >= 640 && fws.y > 40 && fws.y + fws.height < 280 && q(card, 'p-fws-a') && q(card, 'p-fws-b'), 'combined storage, fresh-water station: beside the hot-water zone, no coil');
    check(on(card, 'p-vl-dhw') && !on(card, 'p-fws-a'), 'combined storage, fresh-water station: the valve charges the top zone; the station pipes do not animate');
    card.remove();
    // Separate storages with a parallel buffer: no hot-water tank and no valve, the station stands on the buffer.
    card = mount({ entities: ents, dhw_type: 'fresh_water', language: 'de' }, hassOf(st())); await wait(20);
    const tanks = [...card.shadowRoot.querySelectorAll('rect.tank')];
    check(tanks.length === 1 && !q(card, 'valve-arrow') && !q(card, 'p-vl-dhw') && !q(card, 'coil') && q(card, 'fws'), `fresh-water station on the buffer: one tank (the buffer), no valve (${tanks.length} tanks)`);
    check([...card.shadowRoot.querySelectorAll('.tank-title')].some((t) => t.textContent === 'Frischwasserstation') && q(card, 't-dhw-top').textContent.startsWith('52'), 'fresh-water station: title and outlet temperature');
    const sb = q(card, 'fws').getBBox();
    check(sb.y + sb.height <= 320 && q(card, 'p-fws-a').getAttribute('d').startsWith('M612 320'), 'fresh-water station: above the buffer, fed from its top');
    check(on(card, 'p-vl') && on(card, 'p-rl-buf') && on(card, 'p-hc-vl'), 'fresh-water station, heating: the heat pump charges the buffer');
    card.hass = hassOf(st({ 'binary_sensor.valve': 'on' })); await wait(5);
    check(on(card, 'p-vl') && on(card, 'p-rl-buf') && /Warmwasser/.test(q(card, 'chip-mode').textContent), `fresh-water station, hot water: the heat pump heats the buffer (${q(card, 'chip-mode').textContent})`);
    check(!card._tilePeriods('dhw_loss').length, 'fresh-water station on the buffer: no standby-loss tile, there is no tank');
    card.remove();
    // Without a buffer a fresh-water station cannot be drawn: the tank with its coil stays.
    const { buffer_top: bt, buffer_bottom: bb, ...noBuffer } = ents;
    card = mount({ entities: noBuffer, dhw_type: 'fresh_water' }, hassOf(st())); await wait(20);
    check(q(card, 'coil') && !q(card, 'fws') && q(card, 'valve-arrow'), 'fresh-water station without a buffer: the tank with its coil is drawn');
    card.remove();
    // Configuration rules and editor.
    const err = (config) => { try { document.createElement('heatpump-flow-card').setConfig(config); return ''; } catch (e) { return e.message; } };
    check(/dhw_type must be one of: coil, fresh_water, tank_in_tank/.test(err({ dhw_type: 'plate' })), 'dhw_type accepts coil, fresh_water or tank_in_tank');
    check(/tank_in_tank needs storage: combined/.test(err({ dhw_type: 'tank_in_tank' })) && err({ dhw_type: 'tank_in_tank', storage: 'combined' }) === '', 'tank in tank needs a combined storage');
    const opts = (config) => C._formSchema(config).schema.flatMap(function all(n) { return n.schema ? n.schema.flatMap(all) : [n]; }).find((n) => n.name === 'dhw_type').selector.select.options.map((o) => o.value).join();
    check(opts({}) === 'coil,fresh_water' && opts({ storage: 'combined' }) === 'coil,fresh_water,tank_in_tank', 'editor offers tank in tank only for a combined storage');
    // Standby loss with a combined storage: the circuit pumps must be known, windows with a running circuit pump are left out.
    const lossOf = (config) => { const c = mount(config, hassOf(st())); const ids = c._lossIds(); c.remove(); return ids; };
    check(lossOf({ entities: ents, storage: 'combined' })?.extra.includes('binary_sensor.p'), 'combined storage: the circuit pump is part of the standby check');
    const { hc_pump, ...noPump } = ents;
    check(lossOf({ entities: noPump, storage: 'combined' }) === null, 'combined storage without a circuit pump entity: no standby-loss tile');
    check(!lossOf({ entities: ents })?.extra.includes('binary_sensor.p'), 'separate storages: the circuit pump does not matter for the tank');
    const H = 3600000; const end = Date.now(); const start = end - 48 * H;
    const cool = (from, to, t0, rate) => { const out = []; for (let h = from; h >= to - 1e-9; h -= 0.2) out.push([h, (t0 - rate * (from - h)).toFixed(1)]); return out; };
    const hist = (spec) => Object.fromEntries(Object.entries(spec).map(([id, pts]) => [id, pts.map(([h, s]) => ({ t: end - h * H, s: String(s) }))]));
    const lc = mount({ entities: ents, storage: 'combined' }, hassOf(st())); await wait(20);
    const ids = { temps: ['sensor.t1'], run: { comp: 'binary_sensor.comp' }, extra: ['binary_sensor.p'] };
    // The circuit pump runs from 30 to 10 hours ago and draws heat from the tank (1.0 K/h); otherwise it loses 0.4 K/h.
    const r = lc._dhwLoss(hist({ 'binary_sensor.comp': [[48, 'off']], 'binary_sensor.p': [[48, 'off'], [30, 'on'], [10, 'off']],
      'sensor.t1': [...cool(48, 30.2, 55, 0.4), ...cool(30, 10.2, 55 - 0.4 * 18, 1.0), ...cool(10, 0, 55 - 0.4 * 18 - 20, 0.4)] }), ids, start, end);
    check(r && Math.abs(r.rate - 0.4) < 0.03 && r.windows === 2, `combined storage: windows with a running circuit pump are left out (${JSON.stringify(r)})`);
    lc.remove();
  }

  // 18t. review follow-ups of #130–#132: valve position, editor rules and defaults, editor tile probe, late combined sensors
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['0', 'Hz'], 'binary_sensor.valve': 'on', 'binary_sensor.p': 'on',
      'sensor.t1': ['52', '°C'], 'sensor.t4': ['40', '°C'], 'sensor.t5': ['30', '°C'], ...extra,
    });
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const on = (c, id) => !!q(c, id)?.classList.contains('on');
    // Direct system after a hot-water charge: compressor off, valve still on hot water, circuit pump on. The valve closes the heating side.
    let card = mount({ entities: { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', valve: 'binary_sensor.valve', hc_pump: 'binary_sensor.p', dhw_top: 'sensor.t1' } }, hassOf(st())); await wait(20);
    check(!on(card, 'p-vl') && !on(card, 'p-vl-buf') && !on(card, 'p-byp-vl') && !on(card, 'p-hc-vl') && on(card, 'impeller'), 'valve still on hot water: the circuit pump turns, no water moves through the closed heating side');
    card.hass = hassOf(st({ 'binary_sensor.valve': 'off' })); await wait(5);
    check(on(card, 'p-vl') && on(card, 'p-hc-vl'), 'valve back on heating: the circuit pump moves the water through the heat pump');
    card.remove();
    // A combined-storage sensor that appears after the first drawing gets its gradient stop.
    const ents = { flow: 'sensor.f', compressor: 'sensor.c', hc_pump: 'binary_sensor.p', dhw_top: 'sensor.t1', buffer_top: 'sensor.t4', buffer_bottom: 'sensor.t5' };
    const late = st(); delete late['sensor.t5'];
    card = mount({ entities: ents, storage: 'combined' }, hassOf(late)); await wait(20);
    const before = card.shadowRoot.querySelectorAll('#g-cs stop').length;
    card.hass = hassOf(st()); await wait(20);
    check(before === 2 && !!q(card, 'g-cs-buffer_bottom') && /color-mix/.test(q(card, 'g-cs-buffer_bottom').getAttribute('stop-color')), `a late combined-storage sensor gets its gradient stop (${before} stops before)`);
    card.remove();
    // Editor: clears options that do not go with the chosen storage, and keeps the storage defaults out of the configuration.
    const ed = document.createElement('heatpump-flow-card-editor');
    let out;
    ed.addEventListener('config-changed', (ev) => { out = ev.detail.config; });
    ed.setConfig({ entities: ents, series_buffer: true, series_bypass: false }); ed.hass = hassOf(st());
    ed._changed({ ...ed._form.data, storage: 'combined' });
    let bad = ''; try { document.createElement('heatpump-flow-card').setConfig(out); } catch (e) { bad = e.message; }
    check(out.storage === 'combined' && !('series_buffer' in out) && !('series_bypass' in out) && !bad, `choosing combined storage clears the series buffer (${JSON.stringify(out)} ${bad})`);
    ed._changed({ ...ed._form.data, dhw_type: 'tank_in_tank' });
    check(out.dhw_type === 'tank_in_tank', 'tank in tank is kept with a combined storage');
    ed._changed({ ...ed._form.data, storage: 'separate' });
    bad = ''; try { document.createElement('heatpump-flow-card').setConfig(out); } catch (e) { bad = e.message; }
    check(!('storage' in out) && !('dhw_type' in out) && !bad, `back to separate storages: the default and the tank in tank are cleared (${JSON.stringify(out)} ${bad})`);
    ed._changed({ ...ed._form.data, title: 'Renamed' });
    check(!('storage' in out) && !('dhw_type' in out), 'an unrelated change writes no storage defaults');
    // Editor tile probe: decides the standby-loss tile like the card.
    const tileHas = (config) => C._tileOptions(config, C._resolve(config, hassOf(st())), hassOf(st())).options.some((o) => o.value === 'dhw_loss');
    check(tileHas({ entities: ents, storage: 'combined' }), 'editor offers the standby-loss tile for a combined storage with a circuit pump');
    check(!tileHas({ entities: ents, dhw_type: 'fresh_water' }), 'editor does not offer the standby-loss tile for a fresh-water station on the buffer');
    check(tileHas({ entities: { flow: 'sensor.f', compressor: 'sensor.c', dhw_top: 'sensor.t1' } }), 'editor still offers the standby-loss tile for a plain hot-water tank');
  }

  // 18u. edge cases: shared circuit trunk, sensor without value in a combined storage, cooling, hot water without a tank, station with solar
  {
    const st = (extra = {}) => toStates({
      'sensor.m': 'heating', 'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['40', 'Hz'], 'binary_sensor.p1': 'off', 'binary_sensor.p2': 'on',
      'sensor.t1': ['50', '°C'], 'sensor.t3': ['44', '°C'], 'sensor.t4': ['30', '°C'], 'sensor.sc': ['60', '°C'], ...extra,
    });

    const on = (c, id) => !!q(c, id)?.classList.contains('on');
    const base = { mode: 'sensor.m', flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c' };
    // Circuit 1 stands, circuit 2 heats: the trunk they share flows, circuit 1 itself does not.
    let card = mount({ entities: { ...base, hc_pump: 'binary_sensor.p1', hc2_pump: 'binary_sensor.p2' }, hc_count: 2 }, hassOf(st())); await wait(20);
    check(on(card, 'p-hc-trunk-vl') && on(card, 'p-hc-trunk-rl') && on(card, 'p-hc-up2') && on(card, 'p-hc-down2') && !on(card, 'p-hc-vl') && !on(card, 'p-hc-body'), 'circuit 1 off, circuit 2 on: the shared trunk flows, circuit 1 stands');

    check(!on(card, 'p-hc-trunk-vl') && !on(card, 'p-hc-trunk-rl'), 'all circuits off: the trunk stands');

    card = mount({ entities: { ...base, hc_pump: 'binary_sensor.p2' } }, hassOf(st())); await wait(20);

    card = mount({ entities: { ...base, dhw_top: 'sensor.t1', dhw_bottom: 'sensor.t3', buffer_top: 'sensor.t4' }, storage: 'combined' }, hassOf(st({ 'sensor.t3': 'unavailable' }))); await wait(20);
